<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#06b6d4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NexusTube</title>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://pipedapi.kavin.rocks" crossorigin>
<link rel="manifest" id="manifestLink">
<link rel="icon" id="faviconLink" type="image/svg+xml">
<style>
:root{--bg:#030712;--panel:rgba(15,23,42,.75);--accent:#06b6d4;--glow:rgba(6,182,212,.5);
  --text:#f8fafc;--muted:#94a3b8;--border:rgba(56,189,248,.2);--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
html{overflow-x:clip}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:clip;
  background-image:radial-gradient(circle at 10% 20%,rgba(6,182,212,.08) 0%,transparent 40%),
                   radial-gradient(circle at 90% 80%,rgba(147,51,234,.08) 0%,transparent 40%)}
header{display:flex;align-items:center;gap:1rem;padding:1rem 2rem;border-bottom:1px solid var(--border);
  background:rgba(3,7,18,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:200;flex-wrap:wrap;width:100%}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:.5rem;flex-shrink:0;user-select:none}
.logo span{color:var(--accent);text-shadow:0 0 10px var(--glow)}
.search-container{display:flex;gap:.5rem;flex:1 1 300px;min-width:0;max-width:700px}
.search-input{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--border);padding:.75rem 1rem;
  border-radius:8px;color:var(--text);font-size:1rem;outline:none;transition:all .3s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 15px var(--glow)}
.btn{background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;border:none;padding:.75rem 1.5rem;
  border-radius:8px;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 12px rgba(6,182,212,.3);
  white-space:nowrap;font-size:.95rem;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--glow)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn-secondary{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--border)}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:15px;display:inline-flex;
  align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.icon-btn:hover{background:rgba(6,182,212,.2);border-color:var(--accent)}
#installBtn{display:none}#installBtn.visible{display:inline-flex}
#dlBtn{display:none}
#dlBtn.visible{display:inline-flex}
.platforms-bar{display:flex;gap:.35rem;padding:.5rem 2rem;overflow-x:auto;background:rgba(3,7,18,.5);
  border-bottom:1px solid var(--border);scrollbar-width:none}
.platforms-bar::-webkit-scrollbar{display:none}
.plat-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
  padding:.4rem .85rem;border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .2s;flex-shrink:0}
.plat-btn:hover{background:rgba(6,182,212,.1);color:var(--text)}
.plat-btn.active{background:rgba(6,182,212,.2);color:var(--accent);border-color:var(--accent)}
main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:2rem;
  display:grid;grid-template-columns:1fr 360px;gap:2rem;align-items:start}
@media(max-width:1024px){main{display:flex;flex-direction:column;gap:1rem;padding:1rem}}

.player-sticky{position:sticky;top:0;z-index:50;background:var(--bg);
  display:flex;flex-direction:column;gap:.5rem;padding-bottom:.5rem;
  grid-column:1;grid-row:1;transform:translateZ(0);will-change:transform}
@media(max-width:1024px){
  header{position:relative}
  .player-sticky{padding-top:.5rem;padding-left:.75rem;padding-right:.75rem;
    margin-left:-.75rem;margin-right:-.75rem;width:calc(100% + 1.5rem)}
}

.video-wrapper{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden;
  border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 20px rgba(6,182,212,.1);
  touch-action:pan-y;isolation:isolate}

.video-wrapper:fullscreen,
.video-wrapper:-webkit-full-screen,
.video-wrapper:-moz-full-screen{
  padding-top:0 !important;
  width:100vw !important;height:100vh !important;
  max-width:100vw !important;max-height:100vh !important;
  border-radius:0 !important;border:none !important;
  background:#000 !important;isolation:isolate;
}
.video-wrapper:fullscreen #nativePlayer,
.video-wrapper:-webkit-full-screen #nativePlayer,
.video-wrapper:fullscreen #embedPlayer,
.video-wrapper:-webkit-full-screen #embedPlayer{
  position:absolute !important;top:0 !important;left:0 !important;
  width:100% !important;height:100% !important;
  filter:none !important;-webkit-filter:none !important;
  background:#000 !important;display:block !important;
  transform:translateZ(0) !important;-webkit-transform:translateZ(0) !important;
  will-change:transform;opacity:1 !important;
}
.video-wrapper:fullscreen #nativePlayer,
.video-wrapper:-webkit-full-screen #nativePlayer{object-fit:contain !important}

.video-wrapper.swiping{touch-action:none}
#nativePlayer,#embedPlayer{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
#nativePlayer{object-fit:contain;background:#000;display:none;z-index:1;transition:filter .1s;transform:translateZ(0)}
#embedPlayer{display:none;z-index:2;background:#000;transition:filter .1s}
#embedPlayer iframe,#embedPlayer > div{width:100%!important;height:100%!important;border:0;display:block;
  position:absolute!important;top:0!important;left:0!important;z-index:2}

.gesture-overlay{position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:.8rem .7rem;border-radius:12px;
  display:none;flex-direction:column;align-items:center;z-index:30;pointer-events:none;
  border:1px solid rgba(255,255,255,.25);box-shadow:0 4px 20px rgba(0,0,0,.6);min-width:58px}
.gesture-overlay.show{display:flex}
.gesture-overlay.volume{right:12px}
.gesture-overlay.brightness{left:12px}
.gesture-icon{font-size:1.3rem;margin-bottom:.4rem}
.gesture-text{font-size:.8rem;font-weight:700;margin-bottom:.4rem}
.gesture-bar{width:8px;height:100px;background:rgba(255,255,255,.25);border-radius:4px;position:relative;overflow:hidden}
.gesture-fill{position:absolute;bottom:0;left:0;width:100%;background:var(--accent);height:50%;transition:height .1s}

.exit-fs-btn{position:absolute;top:12px;right:12px;z-index:60;width:32px;height:32px;
  background:transparent;color:#fff;border:none;
  font-size:26px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;
  font-weight:300;user-select:none;-webkit-tap-highlight-color:transparent;
  text-shadow:0 2px 6px rgba(0,0,0,1),0 0 12px rgba(0,0,0,.9);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
.exit-fs-btn.visible{display:flex !important}
.exit-fs-btn:active{transform:scale(.9)}

.controls-bar{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  padding:.5rem .75rem;border-radius:12px;display:flex;flex-direction:column;gap:.4rem}
.control-row{display:flex;align-items:center;width:100%}
.volume-row{justify-content:flex-start;gap:.5rem}
.buttons-row{justify-content:space-between;gap:.25rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.buttons-row::-webkit-scrollbar{display:none}
label{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:60px;max-width:200px;
  background:rgba(255,255,255,.1);height:6px;border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:0 0 8px var(--accent)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
#volVal{font-size:.8rem;color:var(--text);font-weight:600;min-width:38px;text-align:right;flex-shrink:0}
#volNote{font-size:.7rem;color:var(--muted);font-style:italic;white-space:nowrap;flex-shrink:0}
@media(max-width:640px){
  .controls-bar{padding:.4rem .5rem;gap:.3rem}
  .icon-btn{width:30px;height:30px;font-size:12px;border-radius:6px}
  .buttons-row{gap:.15rem}
  #volNote{display:none}
  label{font-size:.65rem}
  #volVal{font-size:.72rem;min-width:32px}
}

/* ═══════════════════════════════════════════════════════════════
   INFO BOX — altura fija, no se ajusta al título
   ═══════════════════════════════════════════════════════════════ */
.video-info{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:10px;padding:.6rem .85rem;
  grid-column:1;grid-row:2;
  display:flex;flex-direction:column;gap:.25rem}
.video-info h2{
  font-size:.95rem;font-weight:700;line-height:1.3;
  min-height:2.47rem;max-height:2.47rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin:0}
.video-info .meta{
  font-size:.72rem;color:var(--muted);
  min-height:1rem;max-height:1rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin:0}
.video-info .desc{
  font-size:.78rem;color:var(--text);line-height:1.4;
  min-height:2.8rem;max-height:2.8rem;overflow:hidden;
  white-space:pre-wrap;word-wrap:break-word;
  transition:max-height .3s ease}
.video-info .desc.expanded{max-height:2000px !important;min-height:0 !important;overflow-y:auto !important}
.video-info .toggle-desc{
  background:rgba(6,182,212,.12);border:1px solid var(--border);
  color:var(--accent);cursor:pointer;
  font-size:.75rem;font-weight:600;
  padding:.4rem .9rem;border-radius:6px;
  align-self:flex-start;margin-top:.2rem;
  display:block;min-height:28px}
.video-info .toggle-desc:active{background:rgba(6,182,212,.25)}
@media(max-width:640px){
  .video-info{padding:.5rem .65rem}
  .video-info h2{font-size:.85rem;min-height:2.21rem;max-height:2.21rem}
  .video-info .meta{font-size:.68rem}
  .video-info .desc{font-size:.72rem;min-height:2.4rem;max-height:2.4rem}
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR — layout estable (fix deformación Mis listas)
   ═══════════════════════════════════════════════════════════════ */
.playlist-sidebar{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:12px;padding:0;
  display:flex;flex-direction:column;overflow:hidden;
  grid-column:2;grid-row:1 / span 2;
  min-height:500px;max-height:750px}
@media(max-width:1024px){
  .playlist-sidebar{min-height:400px;max-height:70vh}
}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{flex:1;background:none;border:none;color:var(--muted);padding:.9rem .3rem;cursor:pointer;
  font-weight:600;font-size:.8rem;transition:all .2s;border-bottom:2px solid transparent}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(6,182,212,.05)}
.tab-pane{
  display:none;padding:1.1rem;
  overflow-y:auto;overflow-x:hidden;
  flex:1 1 auto;
  min-height:0;  /* CRÍTICO para scroll interno */
  max-height:100%}
.tab-pane.active{display:block}

.video-item{display:flex;gap:.75rem;cursor:pointer;padding:.5rem;border-radius:8px;transition:background .2s;
  align-items:flex-start;position:relative}
.video-item:hover{background:rgba(255,255,255,.05)}
.video-item.active{background:rgba(6,182,212,.15)}
.thumb-wrap{position:relative;width:120px;height:68px;flex-shrink:0;background:#111;border-radius:4px;overflow:hidden}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.duration{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.85);color:#fff;
  padding:1px 4px;border-radius:3px;font-size:.65rem;font-weight:600}
.video-item-info{min-width:0;flex:1}
.video-item-info h4{font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.25}
.video-item-info p{font-size:.74rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-item-actions{display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .2s}
.video-item:hover .video-item-actions{opacity:1}
.video-item-actions button{background:rgba(0,0,0,.5);border:none;color:#fff;width:24px;height:24px;
  border-radius:4px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.platform-tag{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.8);
  padding:1px 5px;border-radius:3px;font-size:.6rem;font-weight:700;color:var(--accent);letter-spacing:.03em}
.loading-msg,.empty-msg{color:var(--muted);font-size:.85rem;text-align:center;padding:1rem}
.tv-controls{position:sticky;top:-1.1rem;background:var(--panel);padding:.7rem 1.1rem;margin:-1.1rem -1.1rem .5rem;
  z-index:10;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem}
.tv-back{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;font-weight:600;
  padding:0;text-align:left;align-self:flex-start}
.tv-search{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:.45rem .7rem;border-radius:6px;font-size:.8rem;outline:none;width:100%}
.tv-search:focus{border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.tv-global-search{background:rgba(6,182,212,.1);border:1px solid var(--accent);color:var(--text);
  padding:.6rem .8rem;border-radius:6px;font-size:.85rem;outline:none;width:100%;margin-bottom:.75rem}
.tv-nav{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:1rem}
.tv-nav-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:.5rem;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s}
.tv-nav-btn:hover{background:rgba(6,182,212,.15);border-color:var(--accent)}
.channel-item{display:flex;gap:.65rem;align-items:center;padding:.5rem;border-radius:6px;cursor:pointer;
  transition:background .15s;border:1px solid transparent}
.channel-item:hover{background:rgba(255,255,255,.05)}
.channel-item.active{background:rgba(6,182,212,.18);border-color:var(--accent)}
.channel-item img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.05);flex-shrink:0}
.channel-item .info{flex:1;min-width:0}
.channel-item .info h4{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.channel-item .info p{font-size:.7rem;color:var(--muted);margin-top:2px}
.tv-count{font-size:.72rem;color:var(--muted);padding:.25rem 0}
.pl-group{margin-bottom:1rem;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:rgba(0,0,0,.15)}
.pl-header{display:flex;align-items:center;justify-content:space-between;padding:.65rem .85rem;cursor:pointer;
  background:rgba(255,255,255,.03);transition:background .2s;gap:.5rem}
.pl-header:hover{background:rgba(6,182,212,.1)}
.pl-header .name{font-weight:600;font-size:.88rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-header .count{font-size:.72rem;color:var(--muted);flex-shrink:0}
.pl-header .actions{display:flex;gap:3px;flex-shrink:0}
.pl-header .actions button{background:none;border:none;color:var(--muted);width:24px;height:24px;
  border-radius:4px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.pl-items{max-height:0;overflow:hidden;transition:max-height .3s ease}
.pl-group.expanded .pl-items{max-height:2000px;overflow-y:auto}
.pl-items-inner{padding:.35rem}
.pl-item{display:flex;align-items:center;gap:.4rem;padding:.4rem .5rem;border-radius:4px;
  cursor:pointer;font-size:.8rem;transition:background .15s}
.pl-item:hover{background:rgba(255,255,255,.05)}
.pl-item .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-item .ctrl{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .15s}
.pl-item:hover .ctrl{opacity:1}
.pl-item .ctrl button{background:none;border:none;color:var(--muted);width:20px;height:20px;
  cursor:pointer;font-size:11px;border-radius:3px;display:flex;align-items:center;justify-content:center}
#newListBtn{width:100%;margin-bottom:1rem}
.ctx-menu{position:fixed;background:rgba(10,15,28,.98);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:10px;padding:.4rem;z-index:10001;
  min-width:200px;max-width:92vw;max-height:60vh;overflow-y:auto;box-shadow:0 15px 40px rgba(0,0,0,.85)}
.dl-list{display:flex;flex-direction:column;gap:2px}
.dl-item{display:flex;justify-content:space-between;align-items:center;padding:.6rem .75rem;
  border-radius:6px;cursor:pointer;font-size:.85rem;transition:background .15s;gap:.5rem}
.dl-item:hover{background:rgba(6,182,212,.15)}
.dl-item .q{font-weight:600}
.dl-item .s{color:var(--muted);font-size:.72rem;flex-shrink:0}
.dl-empty{padding:1rem;text-align:center;color:var(--muted);font-size:.85rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(150%);
  background:rgba(15,23,42,.96);border:1px solid var(--accent);color:var(--text);padding:.85rem 1.5rem;
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .35s;z-index:10002;
  max-width:90vw;font-size:.9rem;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(6,182,212,.3);border-radius:4px}
.custom-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10003;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.custom-modal.open{display:flex}
.custom-modal-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.5rem;max-width:400px;width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.8)}
.custom-modal-box p{font-size:1rem;margin-bottom:1.5rem}
.custom-modal-actions{display:flex;gap:1rem;justify-content:center}
</style>
</head>
<body>

<header>
  <div class="logo">NEXUS<span>TUBE</span></div>
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar en toda la web o pegar URL...">
    <button class="btn" id="loadBtn">Buscar</button>
  </div>
  <button class="btn btn-secondary" id="installBtn">📲</button>
</header>

<div class="platforms-bar">
  <button class="plat-btn active" data-plat="youtube">▶️ YouTube</button>
  <button class="plat-btn" data-plat="dailymotion">🎬 Dailymotion</button>
  <button class="plat-btn" data-plat="vimeo">📹 Vimeo</button>
  <button class="plat-btn" data-plat="tv">📡 TV en Vivo</button>
  <button class="plat-btn" data-plat="web">🌐 Web</button>
</div>

<main>
  <div class="player-sticky" id="playerSticky">
    <div class="video-wrapper" id="videoWrapper">
      <video id="nativePlayer" playsinline controls crossorigin="anonymous" preload="auto"></video>
      <div id="embedPlayer"></div>
      
      <div class="gesture-overlay volume" id="volumeOverlay">
        <div class="gesture-icon" id="volumeIcon">🔊</div>
        <div class="gesture-text" id="volumeText">100%</div>
        <div class="gesture-bar"><div class="gesture-fill" id="volumeFill" style="height:20%"></div></div>
      </div>
      <div class="gesture-overlay brightness" id="brightnessOverlay">
        <div class="gesture-icon" id="brightnessIcon">☀️</div>
        <div class="gesture-text" id="brightnessText">100%</div>
        <div class="gesture-bar"><div class="gesture-fill" id="brightnessFill" style="height:75%"></div></div>
      </div>
      
      <button class="exit-fs-btn" id="exitFsBtn" aria-label="Salir de pantalla completa">✕</button>
    </div>
    
    <div class="controls-bar">
      <div class="control-row volume-row">
        <label for="volumeRange">Vol</label>
        <input type="range" id="volumeRange" min="0" max="100" value="100">
        <span id="volVal">100%</span>
        <span id="volNote"></span>
      </div>
      <div class="control-row buttons-row">
        <button class="icon-btn" id="prevBtn" title="Anterior">⏮</button>

function parseVideoId(input){if(!input)return null;input=input.trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(input))return input;
  for(const p of [/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,/[?&]v=([a-zA-Z0-9_-]{11})/]){
    const m=input.match(p);if(m&&m[1])return m[1]}
  return null}
function extractId(path){if(!path)return null;
  const m=path.match(/[?&]v=([a-zA-Z0-9_-]{11})/)||path.match(/([a-zA-Z0-9_-]{11})(?:[?&]|$)/);
  return m?m[1]:null}
function fmtDur(sec){if(sec===undefined||sec===null||sec<0||isNaN(sec))return '';sec=Math.floor(sec);
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return m+':'+String(s).padStart(2,'0')}
function detectSource(input){if(!input)return null;const s=input.trim();
  if(/\.(mp4|webm|ogg|ogv|mov|m4v|m3u8)(\?|#|$)/i.test(s))return{type:'direct',url:s};
  const yt=parseVideoId(s);if(yt)return{type:'youtube',id:yt};
  const vm=s.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(vm)return{type:'vimeo',id:vm[1]};
  const dm=s.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);if(dm)return{type:'dailymotion',id:dm[1]};
  if(/^https?:\/\//.test(s))return{type:'iframe',url:s};
  return null}

    if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}

function updateVolumeMax(){

/* VOLUMEN CON ENTEROS — Math.round */
function applyVolume(v){
  currentVolume = Math.round(Math.max(0,Math.min(500,v)));
  $('volVal').textContent = currentVolume + '%';
  if(playerMode==='native'){
    const el=$('nativePlayer');if(el.muted&&currentVolume>0)el.muted=false;
    if(gainNode&&audioCtx&&audioCtx.state==='running'){gainNode.gain.value=currentVolume/100;el.volume=1}
    else el.volume=Math.min(1,currentVolume/100);
  } else if(playerMode==='iframe'&&ytPlayer&&ytPlayer.setVolume){
    try{ytPlayer.setVolume(Math.min(100,currentVolume))}catch(_){}
  }
  $('volumeRange').value=currentVolume;
}

function applyBrightness(b){
  currentBrightness=Math.max(0.1,Math.min(1.2,b));
  if(!document.fullscreenElement){
    $('nativePlayer').style.filter=`brightness(${currentBrightness})`;
    $('embedPlayer').style.filter=`brightness(${currentBrightness})`;
  } else {
    $('nativePlayer').style.filter='none';
    $('embedPlayer').style.filter='none';
  }
}

function setupBoost(videoEl){try{
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return false}}
  if(audioCtx.state!=='running'){gainNode=null;return false}
  if(connectedVideo!==videoEl){
    if(mediaSourceNode){try{mediaSourceNode.disconnect()}catch(_){}}
    mediaSourceNode=audioCtx.createMediaElementSource(videoEl);
    gainNode=audioCtx.createGain();mediaSourceNode.connect(gainNode);gainNode.connect(audioCtx.destination);
    connectedVideo=videoEl;
  }
  gainNode.gain.value=Math.min(currentVolume,500)/100;return true;
}catch(e){gainNode=null;return false}}

        .map(r=>({id:extractId(r.url),title:r.title||'',uploader:r.uploaderName||''})).filter(r=>r.id);

      if(a720!==b720)return a720-b720;return (b.height||0)-(a.height||0)});
    // Intentar top 3 streams (proxyUrl primero si existe)
    for(const chosen of streams.slice(0,3)){
      const playUrl = chosen.proxyUrl || chosen.url;
      const ok = await tryLoadVideoElement(playUrl, startTime, playUrl);
      if(ok) return true;
    }
    return false;
  }catch(_){return false}
}

/* ═══════════════════════════════════════════════════════════════
   tryLoadVideoElement — VERIFICA reproducción real (fix LatinAutor)
   ═══════════════════════════════════════════════════════════════ */
async function tryLoadVideoElement(url,startTime,downloadUrl){
  const el=$('nativePlayer');
  el.muted=false;el.volume=1;el.crossOrigin='anonymous';
  el.src=url;el.load();
  
  // Esperar loadedmetadata
  const meta = await new Promise(resolve=>{
    let done=false;const fin=v=>{if(!done){done=true;resolve(v)}};
    el.addEventListener('loadedmetadata',()=>fin(true),{once:true});
    el.addEventListener('error',()=>fin(false),{once:true});
    setTimeout(()=>fin(false),5000);
  });
  if(!meta){try{el.removeAttribute('src');el.load()}catch(_){}return false}
  
  // Verificar duración y dimensiones (bloqueados suelen tener 0 o NaN)
  if(!el.duration || isNaN(el.duration) || el.duration === Infinity){
    try{el.removeAttribute('src');el.load()}catch(_){}return false;
  }
  if(!el.videoWidth || el.videoWidth < 50){
    try{el.removeAttribute('src');el.load()}catch(_){}return false;
  }
  
  if(startTime>0)el.currentTime=startTime;
  if(el.videoWidth&&el.videoHeight){
    currentVideoIsVertical = el.videoHeight > el.videoWidth;
  }
  setupBoost(el);detectNativeAudioTracks(el);
  $('embedPlayer').style.display='none';el.style.display='block';
  playerMode='native';updateVolumeMax();
  applyBrightness(currentBrightness);
  
  // CRÍTICO: verificar que REALMENTE reproduce (no solo carga metadata)
  try{
    await el.play();
    await new Promise((resolve,reject)=>{
      const t=setTimeout(()=>reject(new Error('timeout')),3000);
      el.addEventListener('playing',()=>{clearTimeout(t);resolve()},{once:true});
      el.addEventListener('error',()=>{clearTimeout(t);reject(new Error('error'))},{once:true});
    });
  }catch(e){
    try{el.removeAttribute('src');el.load()}catch(_){}
    return false;
  }
  
  applyVolume(currentVolume);updatePauseBtn();
  currentStreamUrl=downloadUrl||url;updateDownloadBtn(true);
  return true;
}

/* ═══════════════════════════════════════════════════════════════
   TV — filtros y auto-skip
   ═══════════════════════════════════════════════════════════════ */
async function loadTV(ch,idx){
  destroyPlayer();
  if(typeof idx==='number'&&idx>=0)tvSeqIdx=idx;
  const el=$('nativePlayer');
  el.style.display='block';el.crossOrigin='anonymous';el.muted=false;
  playerMode='native';
  
  if(!/\.m3u8/i.test(ch.url) && !/\.mp4/i.test(ch.url)){
    if(tvSeqList.length && tvSeqIdx < tvSeqList.length-1){
      return playTVByIndex(tvSeqIdx+1);
    }
    return toast('No hay más canales disponibles');
  }
  
  let handled=false;
  let timers=[];
  const cleanup=()=>{timers.forEach(t=>clearTimeout(t));timers=[]};
  const fail=()=>{
    if(handled)return;
    handled=true;cleanup();
    if(hlsInstance){try{hlsInstance.destroy()}catch(_){}hlsInstance=null}
    if(tvSeqList.length&&tvSeqIdx>=0&&tvSeqIdx<tvSeqList.length-1){
      setTimeout(()=>playTVByIndex(tvSeqIdx+1),200);
    }else{
      toast('No hay más canales disponibles');
    }
  };
  
  timers.push(setTimeout(()=>{if(el.readyState<1)fail()},7000));
  timers.push(setTimeout(()=>{if(el.readyState<3)fail()},10000));
  
  el.addEventListener('error',fail,{once:true});
  el.addEventListener('playing',()=>{
    cleanup();handled=true;
    el.muted=false;applyVolume(currentVolume);
  },{once:true});
  
  if(/\.m3u8/i.test(ch.url)&&window.Hls&&Hls.isSupported()){
    try{
      hlsInstance=new Hls({enableWorker:true,lowLatencyMode:false,
        manifestLoadingTimeOut:7000,levelLoadingTimeOut:7000,fragLoadingTimeOut:10000});
      hlsInstance.loadSource(ch.url);hlsInstance.attachMedia(el);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{detectHLSAudioTracks();detectHLSSubs()});
      hlsInstance.on(Hls.Events.AUDIO_TRACKS_UPDATED,()=>detectHLSAudioTracks());
      hlsInstance.on(Hls.Events.SUBTITLE_TRACKS_UPDATED,()=>detectHLSSubs());
      hlsInstance.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail()});
    }catch(e){fail();return}
  }else{
    el.src=ch.url;detectNativeAudioTracks(el);
  }
  
  setupBoost(el);updateVolumeMax();
  try{await el.play();el.muted=false}catch(e){
    try{el.muted=true;await el.play();
      setTimeout(()=>{if(!el.paused){el.muted=false;applyVolume(currentVolume)}},300)
    }catch(_){}
  }
  applyVolume(currentVolume);applyBrightness(currentBrightness);updatePauseBtn();
  currentStreamUrl=ch.url;updateDownloadBtn(true);
}

function detectNativeAudioTracks(el){availableAudioTracks=[];currentAudioTrackId=null;try{
  if(el.audioTracks&&el.audioTracks.length>1){
    for(let i=0;i<el.audioTracks.length;i++){const t=el.audioTracks[i];
      availableAudioTracks.push({id:i,name:t.label||t.language||('Pista '+(i+1)),lang:t.language||'',source:'native'});
      if(t.enabled)currentAudioTrackId=i}
  }}catch(_){}}
function detectHLSAudioTracks(){availableAudioTracks=[];currentAudioTrackId=null;try{
  if(!hlsInstance||!hlsInstance.audioTracks||!hlsInstance.audioTracks.length)return;
  hlsInstance.audioTracks.forEach((t,i)=>availableAudioTracks.push({id:i,name:t.name||t.lang||('Pista '+(i+1)),lang:t.lang||'',source:'hls'}));
  currentAudioTrackId=hlsInstance.audioTrack}catch(_){}}
function detectHLSSubs(){try{if(!hlsInstance||!hlsInstance.subtitleTracks)return;
  hlsInstance.subtitleTracks.forEach((t,i)=>{const code=t.lang||t.name||('track-'+i);
    if(!availableSubtitles.find(s=>s.code===code))availableSubtitles.push({code,name:t.name||t.lang||code,auto:!!t.forced,source:'hls',idx:i})})}catch(_){}}

async function applySubtitle(code,src){
  currentSubtitle=code;
  if(playerMode==='iframe'&&ytPlayer){
    try{
      if(!code){ytPlayer.unloadModule('captions');toast('Subtítulos desactivados');return}
      const list=ytPlayer.getOption('captions','tracklist')||[];
      if(list.length===0){toast('⚠️ YouTube no tiene subtítulos');return}
      let match=list.find(t=>t.languageCode===code);
      if(!match)match=list.find(t=>t.languageCode&&t.languageCode.startsWith(code));
      if(!match)match=list[0];
      ytPlayer.loadModule('captions');
      setTimeout(()=>{
        try{ytPlayer.setOption('captions','track',{languageCode:match.languageCode})}catch(e){}
        setTimeout(()=>{try{ytPlayer.setOption('captions','reload',true)}catch(e){}},200);
      },300);
      toast('💬 '+(match.displayName||match.languageCode));
      return;
    }catch(e){return}
  }
  if(hlsInstance&&hlsInstance.subtitleTracks?.length){
    if(!code){
      try{hlsInstance.subtitleTrack=-1;hlsInstance.subtitleDisplay=false}catch(_){}
      toast('Subtítulos desactivados');return;
    }
    const sub=availableSubtitles.find(s=>s.code===code&&s.source==='hls');
    if(sub){
      try{
        hlsInstance.subtitleTrack=sub.idx;
        hlsInstance.subtitleDisplay=true;
        toast('💬 '+sub.name);return;
      }catch(_){}
    }
  }
  const el=$('nativePlayer');
  if(!code){
    for(let i=0;i<el.textTracks.length;i++)el.textTracks[i].mode='disabled';
    toast('Subtítulos desactivados');return;
  }
  let foundIdx=-1;
  for(let i=0;i<el.textTracks.length;i++){
    const tt=el.textTracks[i];const lang=tt.language||'';
    if(lang===code||lang.startsWith(code)||code.startsWith(lang)){foundIdx=i;break;}
  }
  if(foundIdx>=0){
    for(let i=0;i<el.textTracks.length;i++)el.textTracks[i].mode=(i===foundIdx)?'showing':'disabled';
    toast('💬 '+(availableSubtitles.find(s=>s.code===code)?.name||code));return;
  }
  const sub=availableSubtitles.find(s=>s.code===code);
  if(!sub||!sub.url){toast('⚠️ Subtítulo no disponible');return}
  let text=null;
  const urls=[sub.url,'https://corsproxy.io/?'+encodeURIComponent(sub.url),'https://api.allorigins.win/raw?url='+encodeURIComponent(sub.url)];
  for(const u of urls){
    try{
      const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),6000);
      const response=await fetch(u,{signal:ctrl.signal});clearTimeout(t);
      if(!response.ok)continue;
      text=await response.text();
      if(text&&text.length>10)break;
    }catch(e){}
  }
  if(!text){toast('⚠️ No se pudo cargar subtítulo');return}
  try{
    text=text.replace(/\r\n/g,'\n').trim();
    if(!text.startsWith('WEBVTT'))text='WEBVTT\n\n'+text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2');
    const dataUri='data:text/vtt;charset=utf-8,'+encodeURIComponent(text);
    const track=document.createElement('track');
    track.kind='subtitles';track.label=sub.name||code;track.srclang=code;track.src=dataUri;
    const forceShow=()=>{
      for(let i=0;i<el.textTracks.length;i++){
        const tt=el.textTracks[i];const lang=tt.language||'';
        if(lang===code||lang.startsWith(code)||code.startsWith(lang))tt.mode='showing';
      }
    };
    track.addEventListener('load',()=>setTimeout(forceShow,100));
    el.appendChild(track);
    setTimeout(forceShow,300);setTimeout(forceShow,800);setTimeout(forceShow,1500);
    toast('💬 '+(sub.name||code));
  }catch(e){toast('⚠️ Error al cargar subtítulos')}
}

  if(!relatedCache[id]){
    try{
      const data=await pipedFetch('/streams/'+id,3000);
      relatedCache[id]=(data.relatedStreams||[]).filter(r=>r.type==='stream'&&r.url)
        .map(r=>({id:extractId(r.url),title:r.title||'',uploader:r.uploaderName||''})).filter(r=>r.id);
    }catch(_){relatedCache[id]=[]}
  }
  const pool=(relatedCache[id]||[]).filter(v=>v.id!==id&&!recentlyPlayed.has(v.id));
  if(!pool.length)return null;
  const currentUploader=(currentVideoData?.uploader||currentVideoData?.author||'').toLowerCase().trim();
  if(currentUploader){
    const sameUploader=pool.filter(v=>v.uploader&&v.uploader.toLowerCase().trim()===currentUploader);
    if(sameUploader.length>0)return sameUploader[Math.floor(Math.random()*sameUploader.length)];
  }
  const cat=(currentCategory||'').toLowerCase().trim();
  if(cat){
    const sameCategory=pool.filter(v=>(v.uploader&&v.uploader.toLowerCase().includes(cat))||(v.title&&v.title.toLowerCase().includes(cat)));
    if(sameCategory.length>0)return sameCategory[Math.floor(Math.random()*sameCategory.length)];
  }
  return null;
}

async function preloadNext(currentId){
  if(!currentId||isAutoAdvancing)return;
  try{
    const next=await pickRelated(currentId);
    if(next){
      try{
        const data=await pipedFetch('/streams/'+next.id,3000);
        const streams=(data.videoStreams||[]).filter(s=>!s.videoOnly&&s.url);
        if(streams.length){const pv=$('preloadVideo');pv.src=streams[0].proxyUrl||streams[0].url;pv.load();}
      }catch(_){}
      const img=new Image();img.src=`https://i.ytimg.com/vi/${next.id}/mqdefault.jpg`;
      preloadedNext=next;
    }
  }catch(e){}
}

async function handleEnded(){
  if(isAutoAdvancing)return;
  isAutoAdvancing=true;
  try{
    if(!currentVideoId)return;
    let next=preloadedNext;preloadedNext=null;
    if(!next)next=await pickRelated(currentVideoId);
    if(next){
      toast(`▶️ ${next.title?next.title.slice(0,50):'Siguiente'}`,2000);
      await playVideo({type:'youtube',id:next.id},{title:next.title});
    }else{
      toast('No hay más videos de esta categoría');
    }
  }catch(e){console.warn('handleEnded:',e)}
  finally{isAutoAdvancing=false}
}

    if(items.length){renderResults(items,'vimeo');return}throw new Error('empty');
  }catch(_){renderResults([

function parseVimeoRSS(xml){
  const items=[];const matches=xml.matchAll(/<item>([\s\S]*?)<\/item>/g);
  for(const m of matches){const inner=m[1];
    const tM=inner.match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/);
    const lM=inner.match(/<link>([\s\S]*?)<\/link>/);
    const thM=inner.match(/<media:thumbnail[^>]*url="([^"]*)"/);
    if(lM){const idM=lM[1].match(/vimeo\.com\/(\d+)/);
      if(idM)items.push({id:idM[1],title:tM?tM[1].trim():'Vimeo',uploader:'Vimeo Staff Picks',thumbnail:thM?thM[1]:'',platform:'vimeo'})}
  }
  return items.slice(0,20);
}

async function performSearch(q){
  q=(q||'').trim();if(!q){toast('Escribe algo');return}
  if(currentPlatform==='tv'){searchAllTV(q);return}
  const src=detectSource(q);if(src){playVideo(src);return}
  const list=$('suggestionsList');list.innerHTML='<div class="loading-msg">Buscando...</div>';

    if(currentPlatform==='youtube')renderResults(await searchYouTube(q),'youtube');

async function searchYouTube(q){
  try{
    const results=await Promise.allSettled(PIPED.map(async base=>{
      const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),4000);
      const res=await fetch(base+'/search?q='+encodeURIComponent(q)+'&filter=videos',{signal:ctrl.signal});
      clearTimeout(t);if(!res.ok)throw 0;
      const data=await res.json();
      const items=(data.items||[]).map(i=>({id:extractId(i.url),title:i.title,uploader:i.uploaderName||i.uploader||'',thumbnail:i.thumbnail,duration:i.duration,platform:'youtube'})).filter(i=>i.id);
      if(!items.length)throw 0;return items
    }));
    const ok=results.find(r=>r.status==='fulfilled');
    if(ok&&ok.value.length)return ok.value;
  }catch(_){}
  return [];
}
async function searchDailymotion(q){
  try{
    const res=await fetch(`https://api.dailymotion.com/videos?search=${encodeURIComponent(q)}&fields=id,title,thumbnail_240_url,owner.screenname,duration,embeddable&limit=20&sort=relevance`);
    const data=await res.json();
    return (data.list||[]).filter(v=>v.embeddable).map(v=>({id:v.id,title:v.title,uploader:v['owner.screenname']||'',thumbnail:v.thumbnail_240_url,duration:v.duration,platform:'dailymotion'}));
  }catch(_){return[]}
}
const SEARXNG_INSTANCES=['https://searx.tiekoetter.com','https://baresearch.org','https://search.inetol.net','https://paulgo.io','https://searx.be'];
async function searchSearXNG(q,category='videos'){
  const ps=SEARXNG_INSTANCES.map(async base=>{
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),4000);
    try{
      const targetUrl=`${base}/search?q=${encodeURIComponent(q)}&format=json&categories=${category}&language=all&safesearch=0`;
      const proxyUrl=`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
      const res=await fetch(proxyUrl,{signal:ctrl.signal});clearTimeout(t);if(!res.ok)throw 0;
      const data=await res.json();
      return (data.results||[]).map(r=>{
        const ytId=r.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        let platform='web',id=r.url;
        if(ytId){platform='youtube';id=ytId[1]}
        return{id,title:r.title||'',uploader:r.engine||'web',thumbnail:r.thumbnail||r.img_src||'',url:r.url,platform}
      });
    }catch(_){clearTimeout(t);throw 0}
  });
  const results=await Promise.allSettled(ps);
  const all=[];results.forEach(r=>{if(r.status==='fulfilled'&&r.value)all.push(...r.value)});
  return all;
}
async function searchWeb(q){
  const [sxV,sxG,yt,dm]=await Promise.allSettled([searchSearXNG(q,'videos'),searchSearXNG(q,'general'),searchYouTube(q),searchDailymotion(q)]);
  const items=[];
  if(sxV.status==='fulfilled')items.push(...sxV.value);
  if(sxG.status==='fulfilled')items.push(...sxG.value);
  if(yt.status==='fulfilled')items.push(...yt.value);
  if(dm.status==='fulfilled')items.push(...dm.value);
  const seen=new Set();return items.filter(i=>{const k=i.url||i.id;if(seen.has(k))return false;seen.add(k);return true});
}

function renderResults(items,type){
  const list=$('suggestionsList');list.innerHTML='';
  if(!items||!items.length){list.innerHTML='<div class="empty-msg">Sin resultados</div>';return}
  const seen=new Set();
  items.forEach((item,idx)=>{
    if(!item.id||seen.has(item.id))return;seen.add(item.id);
    const plat=item.platform||'youtube';
    let thumb=item.thumbnail||'';
    if(!thumb&&plat==='youtube')thumb=`https://i.ytimg.com/vi/${item.id}/mqdefault.jpg`;
    const tag=plat==='dailymotion'?'DM':plat==='youtube'?'YT':plat==='vimeo'?'VM':plat==='web'?'WEB':'';
    const dur=fmtDur(item.duration);
    const div=document.createElement('div');div.className='video-item';div.dataset.vid=item.id;
    div.innerHTML=`<div class="thumb-wrap">
      ${tag?`<span class="platform-tag">${tag}</span>`:''}
      <img src="${esc(thumb)}" alt="" loading="${idx<8?'eager':'lazy'}" referrerpolicy="no-referrer" onerror="this.style.opacity=0">
      ${dur?`<span class="duration">${esc(dur)}</span>`:''}
    </div>
    <div class="video-item-info"><h4>${esc(item.title||'Sin título')}</h4><p>${esc(item.uploader||'')}</p></div>
    <div class="video-item-actions"><button data-add title="Añadir">+</button></div>`;
    div.addEventListener('click',e=>{
      if(e.target.closest('[data-add]')){e.stopPropagation();showAddToList({id:item.id,title:item.title,uploader:item.uploader,platform:plat},e.target);return}
      if(plat==='web'&&item.url){const src=detectSource(item.url);if(src)playVideo(src,{title:item.title});else{window.open(item.url,'_blank','noopener')}}
      else if(plat==='dailymotion')playVideo({type:'dailymotion',id:item.id},{title:item.title});
      else if(plat==='vimeo')playVideo({type:'vimeo',id:item.id},{title:item.title});
      else playVideo({type:'youtube',id:item.id},{title:item.title,category:item.uploader});
      window.scrollTo({top:0,behavior:'smooth'});
    });
    list.appendChild(div);
  });
  highlightActive(currentVideoId);
}

function addToList(video,listId){

function showAddToList(video,anchor){
  document.querySelectorAll('.ctx-menu').forEach(m=>m.remove());
  const menu=document.createElement('div');menu.className='ctx-menu';
  const rect=anchor.getBoundingClientRect();
  menu.style.top=Math.min(rect.bottom+4,window.innerHeight-300)+'px';
  menu.style.left=Math.min(rect.left-100,window.innerWidth-220)+'px';
  let html='<div class="dl-list"><div class="dl-item" data-new="1"><span class="q">+ Nueva lista</span></div>';
  getLists().forEach(l=>{html+=`<div class="dl-item" data-lid="${esc(l.id)}"><span class="q">📁 ${esc(l.name)}</span></div>`});
  html+='</div>';menu.innerHTML=html;document.body.appendChild(menu);
  const close=()=>{menu.remove();document.removeEventListener('click',outside)};
  const outside=e=>{if(!menu.contains(e.target)&&e.target!==anchor)close()};
  setTimeout(()=>document.addEventListener('click',outside),10);
  menu.querySelectorAll('.dl-item').forEach(item=>item.addEventListener('click',()=>{
    if(item.dataset.new){const n=prompt('Nombre:');if(n&&n.trim()){const all=getLists();all.push({id:Date.now().toString(36),name:n.trim(),items:[video]});setLists(all);toast('✅ Creada')}}
    else addToList(video,item.dataset.lid);close()}));
}

const TV_COUNTRIES=[{code:'mx',name:'México'},{code:'es',name:'España'},{code:'ar',name:'Argentina'},{code:'co',name:'Colombia'},{code:'ve',name:'Venezuela'},{code:'cl',name:'Chile'},{code:'pe',name:'Perú'},{code:'us',name:'EE.UU.'},{code:'br',name:'Brasil'}];
const TV_CATEGORIES=[{slug:'news',name:'📰 Noticias'},{slug:'sports',name:'⚽ Deportes'},{slug:'movies',name:'🎬 Películas'},{slug:'kids',name:'🧸 Infantil'},{slug:'music',name:'🎵 Música'},{slug:'documentary',name:'📖 Docs'},{slug:'entertainment',name:'🎭 Entretenimiento'}];

function normalizeName(n){return (n||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[^\w\s]/g,'')}
function dedupeChannels(channels){
  const map=new Map();
  channels.forEach(ch=>{const key=normalizeName(ch.name);if(!key)return;
    const isHls=/\.m3u8/i.test(ch.url);
    if(!map.has(key))map.set(key,ch);
    else{const prev=map.get(key);const prevHls=/\.m3u8/i.test(prev.url);if(isHls&&!prevHls)map.set(key,ch)}});
  return Array.from(map.values());
}
function showTVNav(){
  const list=$('suggestionsList');
  let html=`<input type="text" class="tv-global-search" id="tvGlobalInput" placeholder="🌍 Buscar canal...">
    <div style="font-weight:600;margin-bottom:.75rem;font-size:.9rem">🌍 Países</div><div class="tv-nav">`;
  TV_COUNTRIES.forEach(c=>{html+=`<button class="tv-nav-btn" data-type="country" data-code="${c.code}">${c.name}</button>`});
  html+=`</div><div style="font-weight:600;margin:.75rem 0;font-size:.9rem">📚 Categorías</div><div class="tv-nav">`;
  TV_CATEGORIES.forEach(c=>{html+=`<button class="tv-nav-btn" data-type="category" data-code="${c.slug}">${c.name}</button>`});
  html+=`</div>`;
  list.innerHTML=html;
  list.querySelectorAll('.tv-nav-btn').forEach(b=>b.addEventListener('click',()=>loadTVList(b.dataset.type,b.dataset.code)));
  const gi=$('tvGlobalInput');
  gi.addEventListener('keypress',e=>{if(e.key==='Enter'){e.preventDefault();searchAllTV(gi.value)}});
}
async function loadTVList(type,code){
  const list=$('suggestionsList');list.innerHTML='<div class="loading-msg">Cargando...</div>';
  const urls=[];
  if(type==='country')urls.push(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
  else if(type==='category')urls.push(`https://iptv-org.github.io/iptv/categories/${code}.m3u`);
  let all=[];
  await Promise.allSettled(urls.map(async url=>{try{const res=await fetch(url);if(!res.ok)return;const text=await res.text();all=all.concat(parseM3U(text))}catch(_){}}));
  if(!all.length){list.innerHTML='<div class="empty-msg">❌ Error</div>';return}
  renderTVChannels(dedupeChannels(all));
}
async function searchAllTV(q){
  q=(q||'').trim();if(!q)return;
  const list=$('suggestionsList');list.innerHTML='<div class="loading-msg">Buscando...</div>';
  if(!tvGlobalCache){try{const res=await fetch('https://iptv-org.github.io/iptv/index.m3u');tvGlobalCache=dedupeChannels(parseM3U(await res.text()))}catch(e){list.innerHTML='<div class="empty-msg">❌ Error</div>';return}}
  const filtered=tvGlobalCache.filter(c=>(c.name||'').toLowerCase().includes(q.toLowerCase()));
  if(!filtered.length){list.innerHTML='<div class="empty-msg">Sin canales</div>';return}
  renderTVChannels(filtered);
}
function parseM3U(text){
  const lines=text.split('\n'),channels=[];let cur=null;
  for(const line of lines){const t=line.trim();
    if(t.startsWith('#EXTINF:')){cur={};const logo=t.match(/tvg-logo="([^"]*)"/);if(logo)cur.logo=logo[1];const group=t.match(/group-title="([^"]*)"/);if(group)cur.group=group[1];const nm=t.match(/,(.+)$/);if(nm)cur.name=nm[1]}
    else if(t&&!t.startsWith('#')&&cur){cur.url=t;if(cur.name&&cur.url)channels.push(cur);cur=null}}
  return channels;
}
function renderTVChannels(channels){
  const playable = channels.filter(c => /\.m3u8/i.test(c.url) || /\.mp4/i.test(c.url));
  const sorted = playable.sort((a,b)=>{
    const aHls=/\.m3u8/i.test(a.url), bHls=/\.m3u8/i.test(b.url);
    if(aHls && !bHls) return -1;
    if(!aHls && bHls) return 1;
    return 0;
  });
  const list=$('suggestionsList');list.innerHTML='';
  tvSeqList=sorted;tvSeqIdx=-1;
  const bar=document.createElement('div');bar.className='tv-controls';
  bar.innerHTML=`<button class="tv-back" id="tvBack">← Volver</button><input type="text" class="tv-search" id="tvSearch" placeholder="Buscar canal..."><div class="tv-count" id="tvCount"></div>`;
  list.appendChild(bar);
  const container=document.createElement('div');list.appendChild(container);
  renderTVItems(container,sorted);
  $('tvBack').addEventListener('click',showTVNav);
  const search=$('tvSearch');
  search.addEventListener('input',()=>{const q=search.value.toLowerCase().trim();const filtered=q?sorted.filter(c=>(c.name||'').toLowerCase().includes(q)):sorted;tvSeqList=filtered;tvSeqIdx=-1;renderTVItems(container,filtered)});
}
function renderTVItems(container,channels){
  container.innerHTML='';
  const count=$('tvCount');if(count)count.textContent=`${channels.length} canales disponibles`;
  if(!channels.length){container.innerHTML='<div class="empty-msg">Sin canales disponibles</div>';return}
  const frag=document.createDocumentFragment();
  channels.forEach((ch,i)=>{
    const el=document.createElement('div');el.className='channel-item';el.dataset.idx=i;
    el.innerHTML=`<img src="${esc(ch.logo||'')}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity=0"><div class="info"><h4>${esc(ch.name)}</h4><p>${esc(ch.group||'')}</p></div>`;
    el.addEventListener('click',()=>playVideo({type:'tv',channel:ch,idx:i},{title:ch.name}));
    frag.appendChild(el);
  });
  container.appendChild(frag);
}
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='pane'+(name==='trending'?'Trending':'Lists')));
  if(name==='lists')renderLists();
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

attachAudioResumeListener();
updateVolumeMax();updateNavButtons();renderLists();updatePauseBtn();
document.addEventListener('click',()=>{const el=$('nativePlayer');if(el&&el.muted){el.muted=false;el.play().catch(()=>{})}},{once:true});

async function playRandomInitial(){
  const history=getHistory();const lastPlayed=history[0];
  const exclude=new Set(history.slice(0,8).map(h=>h.id));
  let trending=[];
  try{const data=await pipedFetch('/trending?region=US',5000);const items=Array.isArray(data)?data:(data.items||[]);
    trending=items.slice(0,30).map(i=>({id:extractId(i.url),title:i.title,uploader:i.uploaderName||i.uploader||'',thumbnail:i.thumbnail,duration:i.duration})).filter(i=>i.id);
  }catch(_){trending=FALLBACK_YT.map(v=>({id:v.id,title:v.title,uploader:v.uploader,thumbnail:`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`}))}
  if(trending.length){renderResults(trending.map(t=>({...t,platform:'youtube',thumbnail:t.thumbnail||`https://i.ytimg.com/vi/${t.id}/mqdefault.jpg`})),'youtube')}
  if(!trending.length)return;
  const candidates=trending.filter(t=>!exclude.has(t.id));
  let pick=null;
  if(lastPlayed&&lastPlayed.uploader&&candidates.length){const same=candidates.filter(t=>t.uploader===lastPlayed.uploader);if(same.length)pick=same[Math.floor(Math.random()*same.length)]}
  if(!pick){const pool=candidates.length?candidates:trending;pick=pool[Math.floor(Math.random()*pool.length)]}
  if(!pick)return;
  const el=$('nativePlayer');try{el.muted=true}catch(_){}
  await playVideo({type:'youtube',id:pick.id},{title:pick.title});
  try{el.muted=false}catch(_){}
}
playRandomInitial();
