<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#06b6d4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NexusTube</title>
<link rel="manifest" id="manifestLink">
<link rel="icon" id="faviconLink" type="image/svg+xml">
<style>
:root{
  --bg:#030712; --panel:rgba(15,23,42,.75); --accent:#06b6d4;
  --glow:rgba(6,182,212,.5); --text:#f8fafc; --muted:#94a3b8;
  --border:rgba(56,189,248,.2); --ok:#4ade80; --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  background-image:radial-gradient(circle at 10% 20%,rgba(6,182,212,.08) 0%,transparent 40%),
                   radial-gradient(circle at 90% 80%,rgba(147,51,234,.08) 0%,transparent 40%);}
header{display:flex;align-items:center;gap:1rem;padding:1rem 2rem;border-bottom:1px solid var(--border);
  background:rgba(3,7,18,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;flex-wrap:wrap;width:100%}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:.5rem;flex-shrink:0;user-select:none}
.logo span{color:var(--accent);text-shadow:0 0 10px var(--glow)}
.search-container{display:flex;gap:.5rem;flex:1 1 300px;min-width:0;max-width:700px}
.search-input{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--border);padding:.75rem 1rem;
  border-radius:8px;color:var(--text);font-size:1rem;outline:none;transition:all .3s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 15px var(--glow)}
.search-input::placeholder{color:var(--muted)}
.btn{background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;border:none;padding:.75rem 1.5rem;
  border-radius:8px;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 12px rgba(6,182,212,.3);
  white-space:nowrap;font-size:.95rem}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--glow)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn-secondary{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--border)}
.btn-secondary:hover{background:rgba(255,255,255,.15);box-shadow:none}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);
  width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:16px;display:inline-flex;
  align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.icon-btn:hover{background:rgba(6,182,212,.2);border-color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
#installBtn{display:none}
#installBtn.visible{display:inline-flex}

.platforms-bar{display:flex;gap:.35rem;padding:.5rem 2rem;overflow-x:auto;background:rgba(3,7,18,.5);
  border-bottom:1px solid var(--border);scrollbar-width:none}
.platforms-bar::-webkit-scrollbar{display:none}
.plat-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
  padding:.4rem .85rem;border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .2s;flex-shrink:0}
.plat-btn:hover{background:rgba(6,182,212,.1);color:var(--text)}
.plat-btn.active{background:rgba(6,182,212,.2);color:var(--accent);border-color:var(--accent)}

main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:2rem;display:grid;grid-template-columns:1fr 360px;gap:2rem}
@media(max-width:1024px){main{grid-template-columns:1fr;padding:1rem}}
@media(max-width:640px){
  header{padding:.75rem 1rem;gap:.5rem}
  .platforms-bar{padding:.4rem 1rem}
  .logo{font-size:1.15rem}
  .search-container{flex-basis:100%;max-width:100%}
  .btn{padding:.7rem 1rem;font-size:.9rem}
  main{padding:.75rem}
}

.player-section{display:flex;flex-direction:column;gap:1rem;min-width:0}
.video-wrapper{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden;
  border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 20px rgba(6,182,212,.1)}
#nativePlayer,#ytFrame,#ytFrame iframe{position:absolute;top:0;left:0;width:100%!important;height:100%!important;border:none}
#nativePlayer{object-fit:contain;background:#000;display:none}
#ytFrame{display:none}
#nativePlayer:fullscreen,#ytFrame:fullscreen{width:100vw!important;height:100vh!important}

.exit-fs-btn{position:fixed;top:16px;right:16px;z-index:2147483647;width:46px;height:46px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:22px;line-height:1;
  cursor:pointer;display:none;align-items:center;justify-content:center;transition:opacity .3s,background .2s;
  opacity:.4;font-weight:300}
.exit-fs-btn.visible{display:flex}
.exit-fs-btn:hover,.exit-fs-btn:active{opacity:1;background:rgba(6,182,212,.85)}

.controls-bar{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  padding:.75rem 1rem;border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
.control-group{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}
label{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;background:rgba(255,255,255,.1);
  height:6px;border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:0 0 8px var(--accent)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;
  background:var(--accent);cursor:pointer}
#volVal{font-size:.85rem;color:var(--text);font-weight:600;min-width:42px;text-align:right}
#volNote{font-size:.72rem;color:var(--muted);font-style:italic}

.video-info{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:12px;padding:1rem 1.2rem;display:none}
.video-info.visible{display:block}
.video-info h2{font-size:1.1rem;font-weight:700;margin-bottom:.5rem;line-height:1.35}
.video-info .meta{font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
.video-info .desc{font-size:.85rem;color:var(--text);line-height:1.5;max-height:4.5rem;overflow:hidden;
  white-space:pre-wrap;word-wrap:break-word;transition:max-height .3s}
.video-info .desc.expanded{max-height:500px;overflow-y:auto}
.video-info .toggle-desc{background:none;border:none;color:var(--accent);cursor:pointer;
  font-size:.8rem;margin-top:.4rem;padding:0;font-weight:600;display:none}
.video-info .toggle-desc:hover{text-decoration:underline}

.dl-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:500;display:none}
.dl-backdrop.open{display:block}
.dl-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(380px,92vw);max-height:75vh;
  background:rgba(10,15,28,.98);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;
  z-index:501;box-shadow:0 20px 60px rgba(0,0,0,.85);display:none;flex-direction:column;overflow:hidden}
.dl-modal.open{display:flex}
.dl-modal-header{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1rem;
  border-bottom:1px solid var(--border);font-weight:700;font-size:1rem;flex-shrink:0}
.dl-tabs{display:flex;gap:.35rem;padding:.65rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.dl-tab{flex:1;background:none;border:none;color:var(--muted);padding:.5rem;border-radius:6px;
  cursor:pointer;font-weight:600;font-size:.85rem;transition:all .15s}
.dl-tab.active{background:rgba(6,182,212,.2);color:var(--accent)}
.dl-list{display:flex;flex-direction:column;gap:2px;padding:.5rem;overflow-y:auto;flex:1}
.dl-item{display:flex;justify-content:space-between;align-items:center;padding:.65rem .85rem;
  border-radius:6px;cursor:pointer;font-size:.88rem;transition:background .15s;gap:.5rem}
.dl-item:hover{background:rgba(6,182,212,.15)}
.dl-item .q{font-weight:600}
.dl-item .s{color:var(--muted);font-size:.75rem;flex-shrink:0}
.dl-empty{padding:1.5rem 1rem;text-align:center;color:var(--muted);font-size:.85rem}

.playlist-sidebar{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:12px;padding:0;max-height:750px;display:flex;flex-direction:column;overflow:hidden}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{flex:1;background:none;border:none;color:var(--muted);padding:.9rem .3rem;cursor:pointer;
  font-weight:600;font-size:.8rem;transition:all .2s;border-bottom:2px solid transparent}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(6,182,212,.05)}
.tab-pane{display:none;padding:1.1rem;overflow-y:auto;flex:1}
.tab-pane.active{display:block}

.video-item{display:flex;gap:.75rem;cursor:pointer;padding:.5rem;border-radius:8px;transition:background .2s;
  align-items:flex-start;position:relative}
.video-item:hover{background:rgba(255,255,255,.05)}
.video-item.active{background:rgba(6,182,212,.15)}
.video-item img{width:100px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0;background:#111}
.video-item-info{min-width:0;flex:1}
.video-item-info h4{font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.25}
.video-item-info p{font-size:.74rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-item-actions{display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .2s}
.video-item:hover .video-item-actions{opacity:1}
.video-item-actions button{background:rgba(0,0,0,.5);border:none;color:#fff;width:24px;height:24px;
  border-radius:4px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.video-item-actions button:hover{background:var(--accent)}
.video-item .platform-tag{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.75);
  padding:2px 6px;border-radius:4px;font-size:.65rem;font-weight:600;color:var(--accent);pointer-events:none}

.loading-msg,.empty-msg{color:var(--muted);font-size:.85rem;text-align:center;padding:1rem}

.tv-controls{position:sticky;top:-1.1rem;background:var(--panel);padding:.7rem 1.1rem;margin:-1.1rem -1.1rem .5rem;
  z-index:10;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem}
.tv-back{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;font-weight:600;
  padding:0;text-align:left;align-self:flex-start}
.tv-search{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:.45rem .7rem;border-radius:6px;font-size:.8rem;outline:none;width:100%}
.tv-search:focus{border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.tv-nav{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:1rem}
.tv-nav-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:.5rem;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s}
.tv-nav-btn:hover{background:rgba(6,182,212,.15);border-color:var(--accent)}
.channel-item{display:flex;gap:.65rem;align-items:center;padding:.5rem;border-radius:6px;cursor:pointer;transition:background .15s}
.channel-item:hover{background:rgba(255,255,255,.05)}
.channel-item img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.05);flex-shrink:0}
.channel-item .info{flex:1;min-width:0}
.channel-item .info h4{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.channel-item .info p{font-size:.7rem;color:var(--muted);margin-top:2px}

.pl-group{margin-bottom:1rem;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:rgba(0,0,0,.15)}
.pl-header{display:flex;align-items:center;justify-content:space-between;padding:.65rem .85rem;cursor:pointer;
  background:rgba(255,255,255,.03);transition:background .2s;gap:.5rem}
.pl-header:hover{background:rgba(6,182,212,.1)}
.pl-header .name{font-weight:600;font-size:.88rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-header .count{font-size:.72rem;color:var(--muted);flex-shrink:0}
.pl-header .actions{display:flex;gap:3px;flex-shrink:0}
.pl-header .actions button{background:none;border:none;color:var(--muted);width:24px;height:24px;
  border-radius:4px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.pl-header .actions button:hover{background:rgba(255,255,255,.1);color:var(--text)}
.pl-items{max-height:0;overflow:hidden;transition:max-height .3s ease}
.pl-group.expanded .pl-items{max-height:2000px;overflow-y:auto}
.pl-items-inner{padding:.35rem}
.pl-item{display:flex;align-items:center;gap:.4rem;padding:.4rem .5rem;border-radius:4px;
  cursor:pointer;font-size:.8rem;transition:background .15s}
.pl-item:hover{background:rgba(255,255,255,.05)}
.pl-item .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-item .ctrl{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .15s}
.pl-item:hover .ctrl{opacity:1}
.pl-item .ctrl button{background:none;border:none;color:var(--muted);width:20px;height:20px;
  cursor:pointer;font-size:11px;border-radius:3px;display:flex;align-items:center;justify-content:center}
.pl-item .ctrl button:hover{background:rgba(255,255,255,.15);color:var(--text)}
#newListBtn{width:100%;margin-bottom:1rem}

.ctx-menu{position:fixed;background:rgba(10,15,28,.98);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:10px;padding:.4rem;z-index:1000;
  min-width:200px;max-width:92vw;max-height:60vh;overflow-y:auto;
  box-shadow:0 15px 40px rgba(0,0,0,.85)}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(150%);
  background:rgba(15,23,42,.96);border:1px solid var(--accent);color:var(--text);padding:.85rem 1.5rem;
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .35s;z-index:9999;
  max-width:90vw;font-size:.9rem;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(6,182,212,.3);border-radius:4px}
</style>
</head>
<body>

<header>
  <div class="logo">NEXUS<span>TUBE</span></div>
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar video, canal o pegar URL...">
    <button class="btn" id="loadBtn">Buscar</button>
  </div>
  <button class="btn btn-secondary" id="installBtn">📲</button>
</header>

<div class="platforms-bar" id="platformsBar">
  <button class="plat-btn active" data-plat="youtube">▶️ YouTube</button>
  <button class="plat-btn" data-plat="dailymotion">🎬 Dailymotion</button>
  <button class="plat-btn" data-plat="vimeo">📹 Vimeo</button>
  <button class="plat-btn" data-plat="tv">📡 TV en Vivo</button>
  <button class="plat-btn" data-plat="web">🌐 Web</button>
</div>

<main>
  <div class="player-section">
    <div class="video-wrapper" id="videoWrapper">
      <video id="nativePlayer" playsinline controls crossorigin="anonymous"></video>
      <div id="ytFrame"></div>
    </div>

    <div class="controls-bar">
      <div class="control-group">
        <label for="volumeRange">Volumen</label>
        <input type="range" id="volumeRange" min="0" max="100" value="100">
        <span id="volVal">100%</span>
        <span id="volNote"></span>
      </div>
      <div class="control-group" style="margin-left:auto">
        <button class="icon-btn" id="prevBtn" title="Anterior">⏮</button>
        <button class="icon-btn" id="nextBtn" title="Siguiente">⏭</button>
        <button class="icon-btn" id="likeBtn" title="Favorito">🤍</button>
        <button class="icon-btn" id="subsBtn" title="Subtítulos">💬</button>
        <button class="icon-btn" id="dlBtn" title="Descargar">⬇</button>
      </div>
    </div>

    <div class="video-info" id="videoInfo">
      <h2 id="videoTitle"></h2>
      <div class="meta" id="videoMeta"></div>
      <div class="desc" id="videoDesc"></div>
      <button class="toggle-desc" id="toggleDesc">Mostrar más</button>
    </div>
  </div>

  <aside class="playlist-sidebar">
    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="trending">🔥 Explorar</button>
      <button class="tab-btn" data-tab="lists">📚 Mis listas</button>
    </div>
    <div class="tab-pane active" id="paneTrending">
      <div id="suggestionsList"><div class="loading-msg">Cargando...</div></div>
    </div>
    <div class="tab-pane" id="paneLists">
      <div id="listsContent"></div>
    </div>
  </aside>
</main>

<button class="exit-fs-btn" id="exitFsBtn" aria-label="Salir de pantalla completa">✕</button>

<div class="dl-backdrop" id="dlBackdrop"></div>
<div class="dl-modal" id="dlModal">
  <div class="dl-modal-header">
    <span>Descargar</span>
    <button class="icon-btn" id="dlClose" style="width:28px;height:28px;font-size:12px">✕</button>
  </div>
  <div class="dl-tabs">
    <button class="dl-tab active" data-tab="audio">🎵 Audio</button>
    <button class="dl-tab" data-tab="video">🎬 Video</button>
  </div>
  <div class="dl-list" id="dlList"><div class="dl-empty">Cargando opciones...</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* ============================================================
   PWA
   ============================================================ */
(function(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#030712"/><polygon points="200,150 380,256 200,362" fill="#06b6d4"/><text x="256" y="460" text-anchor="middle" font-family="Arial" font-size="56" font-weight="bold" fill="#f8fafc">NEXUS</text></svg>`;
  const icon='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  $('faviconLink').href=icon;
  const m={name:'NexusTube',short_name:'NexusTube',start_url:location.pathname,scope:'./',
    display:'standalone',orientation:'any',background_color:'#030712',theme_color:'#06b6d4',lang:'es',
    icons:[{src:icon,sizes:'192x192',type:'image/svg+xml',purpose:'any'},
           {src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
  $('manifestLink').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));
  if('serviceWorker' in navigator){
    const sw=`self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(
caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{try{if(r.ok&&new URL(e.request.url).origin===location.origin){
const cl=r.clone();caches.open('nx-v3').then(ca=>ca.put(e.request,cl));}}catch(_){}
return r;}).catch(()=>caches.match('./'))));});`;
    try{
      const u=URL.createObjectURL(new Blob([sw],{type:'application/javascript'}));
      navigator.serviceWorker.register(u).catch(()=>{});
    }catch(_){}
  }
  let dp=null;
  const ib=document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;ib.classList.add('visible');});
  ib.addEventListener('click',async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice;}catch(_){}dp=null;ib.classList.remove('visible');});
})();

/* ============================================================
   Utilidades
   ============================================================ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,ms=3000){const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms);}
function parseVideoId(input){
  if(!input)return null;input=input.trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(input))return input;
  for(const p of [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
    /[?&]v=([a-zA-Z0-9_-]{11})/
  ]){const m=input.match(p);if(m&&m[1])return m[1];}
  return null;
}
function extractId(path){
  if(!path)return null;
  const m=path.match(/[?&]v=([a-zA-Z0-9_-]{11})/)||path.match(/([a-zA-Z0-9_-]{11})(?:[?&]|$)/);
  return m?m[1]:null;
}
function fmtSize(bytes){
  if(!bytes||bytes<=0)return '?';
  const u=['B','KB','MB','GB'];let i=0,n=bytes;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return n.toFixed(1)+' '+u[i];
}
function extMime(m){
  if(!m)return 'mp4';
  if(m.includes('mp4'))return 'mp4';
  if(m.includes('webm'))return 'webm';
  if(m.includes('mp3')||m.includes('mpeg'))return 'mp3';
  if(m.includes('m4a'))return 'm4a';
  if(m.includes('ogg')||m.includes('opus'))return 'ogg';
  return 'mp4';
}
function detectSource(input){
  if(!input)return null;
  const s=input.trim();
  if(/\.(mp4|webm|ogg|ogv|mov|m4v|m3u8)(\?|#|$)/i.test(s))return{type:'direct',url:s};
  const yt=parseVideoId(s);if(yt)return{type:'youtube',id:yt};
  const vm=s.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(vm)return{type:'vimeo',id:vm[1]};
  const dm=s.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);if(dm)return{type:'dailymotion',id:dm[1]};
  if(/^https?:\/\//.test(s))return{type:'iframe',url:s};
  if(/^[a-zA-Z0-9_-]{11}$/.test(s))return{type:'youtube',id:s};
  return null;
}

const PIPED=[
  'https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de',
  'https://api.piped.private.coffee','https://pipedapi.reallyaweso.me'
];
const INVIDIOUS=[
  'https://inv.nadeko.net','https://invidious.f5.si',
  'https://invidious.privacyredirect.com','https://yewtu.be'
];

async function pipedFetch(path,timeout=7000){
  for(const base of PIPED){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),timeout);
      const res=await fetch(base+path,{signal:ctrl.signal});
      clearTimeout(t);
      if(!res.ok)continue;
      return await res.json();
    }catch(_){}
  }
  throw new Error('Piped unavailable');
}
async function invidiousFetch(path,timeout=7000){
  for(const base of INVIDIOUS){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),timeout);
      const res=await fetch(base+path,{signal:ctrl.signal});
      clearTimeout(t);
      if(!res.ok)continue;
      return {data:await res.json(),base};
    }catch(_){}
  }
  throw new Error('Invidious unavailable');
}

/* ============================================================
   Volumen dinámico
   ============================================================ */
function updateVolumeMax(){
  const range=$('volumeRange');
  const canBoost=(playerMode==='native'&&gainNode!==null);
  const newMax=canBoost?500:100;
  range.max=newMax;
  if(!canBoost&&currentVolume>100){
    currentVolume=100;range.value=100;$('volVal').textContent='100%';applyVolume(100);
  }else{range.value=currentVolume;}
  $('volNote').textContent=canBoost?'· hasta 500%':'';
  $('volNote').style.color=canBoost?'var(--ok)':'var(--muted)';
}
function applyVolume(v){
  currentVolume=Math.max(0,Math.min(500,v));
  $('volVal').textContent=currentVolume+'%';
  if(playerMode==='native'&&gainNode){
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    gainNode.gain.value=currentVolume/100;
    $('nativePlayer').volume=1;
  }else if(playerMode==='native'){
    $('nativePlayer').volume=Math.min(1,currentVolume/100);
  }else if(playerMode==='iframe'&&player&&player.setVolume){
    try{player.setVolume(Math.min(100,currentVolume));}catch(_){}
  }
}
$('volumeRange').addEventListener('input',e=>applyVolume(parseInt(e.target.value,10)));

function setupBoost(videoEl){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(connectedVideo!==videoEl){
      if(mediaSourceNode){try{mediaSourceNode.disconnect();}catch(_){}}
      mediaSourceNode=audioCtx.createMediaElementSource(videoEl);
      gainNode=audioCtx.createGain();
      mediaSourceNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      connectedVideo=videoEl;
    }
    gainNode.gain.value=Math.min(currentVolume,500)/100;
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    return true;
  }catch(e){console.warn('Boost off:',e.message);gainNode=null;return false;}
}

async function playVideo(src,opts={}){
  if(typeof src==='string')src=detectSource(src);
  if(!src){toast('❌ Fuente no reconocida');return;}

  if(!opts.noNav){
    navHistory=navHistory.slice(0,navIdx+1);
    navHistory.push({src,title:opts.title||''});
    navIdx=navHistory.length-1;
    if(navHistory.length>100){navHistory.shift();navIdx--;}
  }
  updateNavButtons();

  const token=++loadToken;
  currentVideoId=null;
  currentVideoData=null;
  currentPlatform=src.type==='youtube'?'youtube':src.type;

  $('nativePlayer').style.display='none';
  $('ytFrame').style.display='none';
  if(playerMode==='native'){
    try{$('nativePlayer').pause();$('nativePlayer').removeAttribute('src');$('nativePlayer').load();}catch(_){}
  }
  if(playerMode==='iframe'&&player&&player.pauseVideo){try{player.pauseVideo();}catch(_){}}
  if(hlsInstance){try{hlsInstance.destroy();}catch(_){}hlsInstance=null;}
  playerMode='none';

  try{
    if(src.type==='youtube'){
      currentVideoId=src.id;
      markPlayed(src.id);
      await loadYouTube(src.id,opts.startTime||0,token);
      loadVideoInfo(src.id);
    }else if(src.type==='direct'){
      await loadDirect(src.url,opts.startTime||0);
      showBasicInfo('Video',src.url,'');
    }else if(src.type==='vimeo'){
      loadVimeo(src.id);showBasicInfo('Vimeo Video',`https://vimeo.com/${src.id}`,'');
    }else if(src.type==='dailymotion'){
      loadDailymotion(src.id);showBasicInfo('Dailymotion Video',`https://dailymotion.com/video/${src.id}`,'');
    }else if(src.type==='iframe'){
      loadGenericIframe(src.url);showBasicInfo('Video externo',src.url,'');
    }else if(src.type==='tv'){
      await loadTV(src.channel);
      showBasicInfo(src.channel.name,'',src.channel.group||'');
    }
  }catch(e){console.warn(e);toast('⚠️ Error al cargar');}

  updateLikeBtn();
  updateVolumeMax();
}

/* --- YouTube: iframe primero (rápido) + native paralelo (sin ads) --- */
async function loadYouTube(id,startTime,token){
  createIframePlayer(id,startTime);
  playerMode='iframe';
  updateVolumeMax();
  cacheRelated(id);

  // En paralelo, intentar motor nativo (sin anuncios)
  const nativeOk=await tryNativeBackground(id,startTime,4500);
  if(token!==loadToken)return;
  if(!nativeOk)return;

  // Pausar iframe antes de cambiar
  try{if(player&&player.pauseVideo)player.pauseVideo();}catch(_){}

  const el=$('nativePlayer');
  $('ytFrame').style.display='none';
  el.style.display='block';
  playerMode='native';
  updateVolumeMax();

  try{await el.play();}catch(e){
    try{el.muted=true;await el.play();toast('🔇 Toca para activar sonido');}catch(_){}
  }
  applyVolume(currentVolume);
}

async function tryNativeBackground(videoId,startTime,timeout){
  try{
    const data=await pipedFetch('/streams/'+videoId,timeout);
    if(data.livestream||(data.hls&&!data.videoStreams))return false;
    const streams=(data.videoStreams||[]).filter(s=>!s.videoOnly&&s.url);
    if(!streams.length)return false;

    streams.sort((a,b)=>{
      const a720=Math.abs((a.height||0)-720),b720=Math.abs((b.height||0)-720);
      if(a720!==b720)return a720-b720;
      return (b.height||0)-(a.height||0);
    });
    const chosen=streams[0];
    const el=$('nativePlayer');
    el.crossOrigin='anonymous';
    el.src=chosen.url;
    const ok=await new Promise(resolve=>{
      let done=false;const fin=v=>{if(!done){done=true;resolve(v);}};
      el.addEventListener('loadedmetadata',()=>fin(true),{once:true});
      el.addEventListener('error',()=>fin(false),{once:true});
      setTimeout(()=>fin(false),Math.min(timeout,5000));
    });
    if(!ok){try{el.removeAttribute('src');el.load();}catch(_){}return false;}
    if(startTime>0)el.currentTime=startTime;
    setupBoost(el);
    return true;
  }catch(_){return false;}
}

function createIframePlayer(id,startTime=0){
  $('ytFrame').style.display='block';
  $('nativePlayer').style.display='none';
  if(!ytReady){pendingIframe={id,startTime};return;}
  if(player&&player.loadVideoById){
    player.loadVideoById(id,startTime);
    try{player.setVolume(Math.min(100,currentVolume));}catch(_){}
    return;
  }
  player=new YT.Player('ytFrame',{
    videoId:id,width:'100%',height:'100%',
    playerVars:{
      autoplay:1,controls:1,modestbranding:1,rel:0,
      iv_load_policy:3,playsinline:1,origin:location.origin
    },
    events:{
      onReady:e=>{e.target.setVolume(Math.min(100,currentVolume));if(startTime>0)e.target.seekTo(startTime,true);},
      onStateChange:e=>{if(e.data===0)handleEnded();},
      onError:e=>{console.warn('[YT]',e.data);}
    }
  });
}

async function loadDirect(url,startTime){
  const el=$('nativePlayer');
  el.crossOrigin='anonymous';
  el.src=url;
  $('ytFrame').style.display='none';
  el.style.display='block';
  if(startTime>0){
    await new Promise(r=>{el.addEventListener('loadedmetadata',r,{once:true});setTimeout(r,2000);});
    el.currentTime=startTime;
  }
  setupBoost(el);
  playerMode='native';
  updateVolumeMax();
  try{await el.play();}catch(e){try{el.muted=true;await el.play();toast('🔇 Toca para sonido');}catch(_){}}
  applyVolume(currentVolume);
}
function loadVimeo(id){
  $('ytFrame').innerHTML=`<iframe src="https://player.vimeo.com/video/${esc(id)}?autoplay=1" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe>`;
  $('ytFrame').style.display='block';$('nativePlayer').style.display='none';
  playerMode='iframe';updateVolumeMax();
}
function loadDailymotion(id){
  $('ytFrame').innerHTML=`<iframe src="https://www.dailymotion.com/embed/video/${esc(id)}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
  $('ytFrame').style.display='block';$('nativePlayer').style.display='none';
  playerMode='iframe';updateVolumeMax();
}
function loadGenericIframe(url){
  $('ytFrame').innerHTML=`<iframe src="${esc(url)}" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
  $('ytFrame').style.display='block';$('nativePlayer').style.display='none';
  playerMode='iframe';updateVolumeMax();
  toast('⚠️ Algunos sitios bloquean incrustación');
}
async function loadTV(ch){
  const el=$('nativePlayer');
  if(hlsInstance){try{hlsInstance.destroy();}catch(_){}hlsInstance=null;}
  el.pause();try{el.removeAttribute('src');el.load();}catch(_){}
  $('ytFrame').style.display='none';$('ytFrame').innerHTML='';
  el.style.display='block';el.crossOrigin='anonymous';
  if(ch.url.includes('.m3u8')&&window.Hls&&Hls.isSupported()){
    hlsInstance=new Hls({enableWorker:true,lowLatencyMode:false});
    hlsInstance.loadSource(ch.url);hlsInstance.attachMedia(el);
    hlsInstance.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)toast('⚠️ Canal no disponible');});
  }else{el.src=ch.url;}
  setupBoost(el);playerMode='native';updateVolumeMax();
  try{await el.play();}catch(e){try{el.muted=true;await el.play();}catch(_){}}
  applyVolume(currentVolume);
}

   Info del video (título + descripción + subtítulos)

async function loadVideoInfo(id){
  const info=$('videoInfo');
  info.classList.remove('visible');
  try{
    const {data,base}=await invidiousFetch('/api/v1/videos/'+id,7000);
    currentVideoData=data;
    $('videoTitle').textContent=data.title||'';
    const meta=[];
    if(data.author)meta.push(data.author);
    if(data.viewCount)meta.push(parseInt(data.viewCount).toLocaleString()+' vistas');
    $('videoMeta').textContent=meta.join(' · ');
    const desc=data.description||'';
    $('videoDesc').textContent=desc;
    $('videoDesc').classList.remove('expanded');
    $('toggleDesc').textContent='Mostrar más';
    $('toggleDesc').style.display=desc.length>200?'block':'none';
    // Subtítulos
    availableSubtitles=[];
    if(data.captions){
      availableSubtitles=data.captions.map(c=>({
        code:c.language_code,name:c.label||c.language_code,url:c.url,auto:c.auto_generated||false
      }));
    }
    // Guardar base para futuras descargas
    currentVideoData._invBase=base;
    info.classList.add('visible');
  }catch(e){
    // fallback piped
    try{
      const pData=await pipedFetch('/streams/'+id,6000);
      currentVideoData=pData;
      $('videoTitle').textContent=pData.title||'';
      $('videoMeta').textContent=pData.uploader||'';
      const desc=pData.description||'';
      $('videoDesc').textContent=desc;
      $('videoDesc').classList.remove('expanded');
      $('toggleDesc').style.display=desc.length>200?'block':'none';
      availableSubtitles=(pData.subtitles||[]).map(s=>({
        code:s.code,name:s.name||s.code,url:s.url,auto:s.autoGenerated||false
      }));
      info.classList.add('visible');
    }catch(_){}
  }
}
function showBasicInfo(title,meta,desc){
  $('videoTitle').textContent=title||'';
  $('videoMeta').textContent=meta||'';
  $('videoDesc').textContent=desc||'';
  $('videoDesc').classList.remove('expanded');
  $('toggleDesc').style.display='none';
  $('videoInfo').classList.add('visible');
  availableSubtitles=[];
}
$('toggleDesc').addEventListener('click',()=>{
  const d=$('videoDesc');
  const exp=d.classList.toggle('expanded');
  $('toggleDesc').textContent=exp?'Mostrar menos':'Mostrar más';
});

/* ============================================================
   Subtítulos
   ============================================================ */
$('subsBtn').addEventListener('click',(e)=>{
  e.stopPropagation();
  // Si es iframe, agregar tracks del iframe
  if(playerMode==='iframe'&&player&&player.getOption){
    try{
      const tracks=player.getOption('captions','tracklist')||[];
      tracks.forEach(t=>{
        if(!availableSubtitles.find(s=>s.code===t.languageCode)){
          availableSubtitles.push({
            code:t.languageCode,name:t.displayName||t.languageName||t.languageCode,auto:false,iframeOnly:true
          });
        }
      });
    }catch(_){}
  }

  document.querySelectorAll('.ctx-menu').forEach(m=>m.remove());
  const menu=document.createElement('div');
  menu.className='ctx-menu';
  const rect=e.currentTarget.getBoundingClientRect();
  menu.style.top=Math.min(rect.bottom+4,window.innerHeight-320)+'px';
  menu.style.left=Math.min(rect.left-150,window.innerWidth-220)+'px';

  let html='<div class="dl-list">';
  html+=`<div class="dl-item" data-lang="off"><span class="q">Desactivados</span></div>`;
  if(availableSubtitles.length===0){
    html+=`<div class="dl-empty">Sin subtítulos disponibles</div>`;
  }else{
    availableSubtitles.forEach(s=>{
      const active=currentSubtitle===s.code?'✓ ':'';
      html+=`<div class="dl-item" data-lang="${esc(s.code)}"><span class="q">${active}${esc(s.name)}</span><span class="s">${s.auto?'auto':''}</span></div>`;
    });
  }
  html+='</div>';
  menu.innerHTML=html;
  document.body.appendChild(menu);

  const close=()=>{menu.remove();document.removeEventListener('click',outside);};
  const outside=ev=>{if(!menu.contains(ev.target)&&ev.target!==e.currentTarget)close();};
  setTimeout(()=>document.addEventListener('click',outside),10);

  menu.querySelectorAll('.dl-item').forEach(it=>{
    it.addEventListener('click',()=>{
      const lang=it.dataset.lang;
      applySubtitle(lang==='off'?null:lang);
      close();
    });
  });
});

function applySubtitle(langCode){
  currentSubtitle=langCode;
  // Iframe: usar YT API
  if(playerMode==='iframe'&&player&&player.setOption){
    try{
      if(!langCode){
        player.unloadModule('captions');
      }else{
        player.loadModule('captions');
        player.setOption('captions','track',{languageCode:langCode});
        player.setOption('captions','reload',true);
      }
      toast(langCode?`💬 Subtítulos: ${langCode}`:'Subtítulos desactivados');
      return;
    }catch(err){console.warn('iframe subs:',err);}
  }
  // Native: <track>
  const el=$('nativePlayer');
  el.querySelectorAll('track').forEach(t=>t.remove());
  if(!langCode){toast('Subtítulos desactivados');return;}
  const sub=availableSubtitles.find(s=>s.code===langCode);
  if(!sub||!sub.url){toast('⚠️ Subtítulo no disponible');return;}
  const track=document.createElement('track');
  track.kind='subtitles';
  track.label=sub.name;
  track.srclang=sub.code;
  track.src=sub.url;
  track.default=true;
  el.appendChild(track);
  setTimeout(()=>{try{el.textTracks[0].mode='showing';}catch(_){}},200);
  toast('💬 Subtítulos: '+sub.name);
}

/* ============================================================
   Autoplay siguiente
   ============================================================ */
async function cacheRelated(id){
  if(relatedCache[id])return;
  try{
    const data=await pipedFetch('/streams/'+id,5000);
    relatedCache[id]=(data.relatedStreams||[])
      .filter(r=>r.type==='stream'&&r.url)
      .map(r=>({id:extractId(r.url),title:r.title||'',uploader:r.uploaderName||''}))
      .filter(r=>r.id);
  }catch(_){relatedCache[id]=[];}
}
async function pickRelated(id){
  await cacheRelated(id);
  const pool=(relatedCache[id]||[]).filter(v=>v.id!==id&&!recentlyPlayed.has(v.id));
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
async function handleEnded(){
  if(isAutoAdvancing)return;isAutoAdvancing=true;
  try{
    if(!currentVideoId)return;
    const next=await pickRelated(currentVideoId);
    if(next){
      toast(`▶️ ${next.title.slice(0,50)}`,2500);
      await playVideo({type:'youtube',id:next.id},{title:next.title});
    }
  }catch(e){console.warn(e);}finally{isAutoAdvancing=false;}
}
function markPlayed(id){
  if(!id)return;recentlyPlayed.add(id);
  if(recentlyPlayed.size>60){const f=recentlyPlayed.values().next().value;recentlyPlayed.delete(f);}
}
$('nativePlayer').addEventListener('ended',handleEnded);
$('nativePlayer').addEventListener('play',()=>{isAutoAdvancing=false;});

   Fullscreen X
   ============================================================ */
const wrapper=$('videoWrapper');
const exitBtn=$('exitFsBtn');
function lockOrient(m){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock(m).catch(()=>{});}
function unlockOrient(){if(screen.orientation&&screen.orientation.unlock){try{screen.orientation.unlock();}catch(_){}}}
function onFsChange(){
  const fs=document.fullscreenElement||document.webkitFullscreenElement;
  const isOurFs=fs&&(fs===wrapper||fs===$('nativePlayer')||wrapper.contains(fs)||$('ytFrame').contains(fs));
  if(isOurFs){
    exitBtn.classList.add('visible');exitBtn.style.opacity='0.5';
    clearTimeout(exitBtn._hide);
    exitBtn._hide=setTimeout(()=>{exitBtn.style.opacity='0';},2500);
    setTimeout(()=>lockOrient('landscape'),100);
  }else{
    exitBtn.classList.remove('visible');
    setTimeout(()=>{lockOrient('portrait');setTimeout(unlockOrient,800);},200);
  }
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
['click','touchstart'].forEach(ev=>{
  document.addEventListener(ev,()=>{
    if(document.fullscreenElement&&exitBtn.classList.contains('visible')){
      exitBtn.style.opacity='0.8';
      clearTimeout(exitBtn._hide);
      exitBtn._hide=setTimeout(()=>{exitBtn.style.opacity='0';},2500);
    }
  },{passive:true});
});
exitBtn.addEventListener('click',()=>{
  if(document.exitFullscreen)document.exitFullscreen();
  else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
});

function switchPlatform(plat){
  currentPlatform=plat;
  document.querySelectorAll('.plat-btn').forEach(x=>x.classList.toggle('active',x.dataset.plat===plat));
  const list=$('suggestionsList');
  const si=$('searchInput');
  switchTab('trending');
  switch(plat){
    case 'youtube':si.placeholder='Buscar en YouTube...';loadTrending();break;
    case 'dailymotion':si.placeholder='Buscar en Dailymotion...';loadDailymotionTrending();break;
    case 'vimeo':si.placeholder='Buscar o pegar URL de Vimeo...';loadVimeoTrending();break;
    case 'tv':si.placeholder='Filtrar canales...';showTVNav();break;
    case 'web':si.placeholder='Buscar en múltiples plataformas...';loadWebTrending();break;
  }
}

async function loadVimeoTrending(){
  const list=$('suggestionsList');
  list.innerHTML='<div class="loading-msg">Cargando Vimeo...</div>';
  try{
    const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent('https://vimeo.com/channels/staffpicks/videos/rss');
    const res=await fetch(proxy);
    const text=await res.text();
    const items=parseVimeoRSS(text);
    if(items.length){renderResults(items,'vimeo');return;}
    throw new Error('empty');
  }catch(_){
    // Fallback: videos públicos conocidos
    renderResults([
      {id:'76979871',title:'The Mountain — Vimeo Staff Picks',uploader:'Vimeo',thumbnail:'',platform:'vimeo'},
      {id:'1084537',title:'The New Vimeo Player',uploader:'Vimeo',thumbnail:'',platform:'vimeo'},
      {id:'147865858',title:'The Art of Making — Staff Picks',uploader:'Vimeo',thumbnail:'',platform:'vimeo'}
    ],'vimeo');
  }
}

function parseVimeoRSS(xml){
  const items=[];
  const matches=xml.matchAll(/<item>([\s\S]*?)<\/item>/g);
  for(const m of matches){
    const inner=m[1];
    const tM=inner.match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/);
    const lM=inner.match(/<link>([\s\S]*?)<\/link>/);
    const thM=inner.match(/<media:thumbnail[^>]*url="([^"]*)"/);
    if(lM){
      const idM=lM[1].match(/vimeo\.com\/(\d+)/);
      if(idM)items.push({
        id:idM[1],title:tM?tM[1].trim():'Vimeo',uploader:'Vimeo Staff Picks',
        thumbnail:thM?thM[1]:'',platform:'vimeo'
      });
    }
  }
  return items.slice(0,20);
}

async function loadWebTrending(){
  const list=$('suggestionsList');
  list.innerHTML='<div class="loading-msg">Cargando...</div>';
  const [yt,dm]=await Promise.allSettled([
    (async()=>{
      const data=await pipedFetch('/trending?region=US',5000);
      return (data.items||data||[]).slice(0,10).map(i=>({
        id:extractId(i.url),title:i.title,uploader:i.uploaderName||i.uploader||'',
        thumbnail:i.thumbnail,platform:'youtube'
      })).filter(i=>i.id);
    })(),
    (async()=>{
      const res=await fetch('https://api.dailymotion.com/videos?sort=trending&fields=id,title,thumbnail_240_url,owner.screenname&limit=10');
      const data=await res.json();
      return (data.list||[]).map(v=>({
        id:v.id,title:v.title,uploader:v['owner.screenname']||'',
        thumbnail:v.thumbnail_240_url,platform:'dailymotion'
      }));
    })()
  ]);
  const items=[];
  if(yt.status==='fulfilled')items.push(...yt.value);
  if(dm.status==='fulfilled')items.push(...dm.value);
  if(items.length)renderResults(items,'mixed');
  else list.innerHTML='<div class="empty-msg">❌ Sin resultados</div>';
}

$('loadBtn').addEventListener('click',()=>performSearch($('searchInput').value));
$('searchInput').addEventListener('keypress',e=>{
  if(e.key==='Enter'){e.preventDefault();performSearch($('searchInput').value);}
});

async function performSearch(q){
  q=(q||'').trim();
  if(!q){toast('Escribe algo');return;}
  if(currentPlatform==='tv'){filterTVChannels(q);return;}
  const src=detectSource(q);
  if(src){playVideo(src);return;}

  const list=$('suggestionsList');
  list.innerHTML='<div class="loading-msg">Buscando...</div>';
  switchTab('trending');

  try{
    if(currentPlatform==='youtube'){
      renderResults(await searchYouTube(q),'youtube');
    }else if(currentPlatform==='dailymotion'){
      renderResults(await searchDailymotion(q),'dailymotion');
    }else if(currentPlatform==='web'){
      const [yt,dm]=await Promise.allSettled([searchYouTube(q),searchDailymotion(q)]);
      const items=[];
      if(yt.status==='fulfilled')items.push(...yt.value);
      if(dm.status==='fulfilled')items.push(...dm.value);
      renderResults(items,'mixed');
    }else if(currentPlatform==='vimeo'){
      list.innerHTML='<div class="empty-msg">Pega una URL de Vimeo directamente</div>';
    }
  }catch(e){
    console.warn(e);
    list.innerHTML='<div class="empty-msg">❌ Error de búsqueda</div>';
  }
}

async function searchYouTube(q){
  const data=await pipedFetch('/search?q='+encodeURIComponent(q)+'&filter=videos');
  return (data.items||[]).slice(0,25).map(i=>({
    id:extractId(i.url),title:i.title,uploader:i.uploaderName||i.uploader||'',
    thumbnail:i.thumbnail,platform:'youtube'
  })).filter(i=>i.id);
}
async function searchDailymotion(q){
  const res=await fetch(`https://api.dailymotion.com/videos?search=${encodeURIComponent(q)}&fields=id,title,thumbnail_240_url,owner.screenname&limit=20&sort=relevance`);
  const data=await res.json();
  return (data.list||[]).map(v=>({
    id:v.id,title:v.title,uploader:v['owner.screenname']||'',
    thumbnail:v.thumbnail_240_url,platform:'dailymotion'
  }));
}

function renderResults(items,type){
  const list=$('suggestionsList');
  list.innerHTML='';
  if(!items||!items.length){list.innerHTML='<div class="empty-msg">Sin resultados</div>';return;}
  items.forEach(item=>{
    if(!item.id)return;
    const thumb=item.thumbnail||(item.platform==='youtube'?`https://img.youtube.com/vi/${item.id}/mqdefault.jpg`:'');
    const plat=item.platform||'youtube';
    const tag=plat==='dailymotion'?'DM':plat==='youtube'?'YT':plat==='vimeo'?'VM':'';
    const div=document.createElement('div');
    div.className='video-item';
    div.dataset.vid=item.id;
    div.innerHTML=`
      ${tag?`<span class="platform-tag">${tag}</span>`:''}
      <img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.style.opacity=0">
      <div class="video-item-info">
        <h4>${esc(item.title||'Sin título')}</h4>
        <p>${esc(item.uploader||'')}</p>
      </div>
      <div class="video-item-actions">
        <button data-add title="Añadir a lista">+</button>
      </div>`;
    div.addEventListener('click',e=>{
      if(e.target.closest('[data-add]')){
        e.stopPropagation();
        showAddToList({id:item.id,title:item.title,uploader:item.uploader,platform:plat},e.target);
        return;
      }
      if(plat==='dailymotion')playVideo({type:'dailymotion',id:item.id},{title:item.title});
      else if(plat==='vimeo')playVideo({type:'vimeo',id:item.id},{title:item.title});
      else playVideo({type:'youtube',id:item.id},{title:item.title});
      window.scrollTo({top:0,behavior:'smooth'});
    });
    list.appendChild(div);
  });
  highlightActive(currentVideoId);
}
function highlightActive(id){
  document.querySelectorAll('.video-item').forEach(el=>el.classList.toggle('active',el.dataset.vid===id));
}

function getLists(){try{return JSON.parse(localStorage.getItem('nx_lists')||'[]');}catch(_){return[];}}
function setLists(l){localStorage.setItem('nx_lists',JSON.stringify(l));renderLists();}
function getHistory(){try{return JSON.parse(localStorage.getItem('nx_history')||'[]');}catch(_){return[];}}
function pushHistory(v){
  if(!v||!v.id)return;
  let h=getHistory().filter(x=>x.id!==v.id);
  h.unshift({...v,ts:Date.now()});
  h=h.slice(0,80);
  localStorage.setItem('nx_history',JSON.stringify(h));
}
function getCurrentTitle(){
  if(currentVideoData?.title)return currentVideoData.title;
  const item=document.querySelector(`.video-item[data-vid="${currentVideoId}"]`);
  if(item)return item.querySelector('h4')?.textContent||currentVideoId;
  const fav=getFavs().find(f=>f.id===currentVideoId);
  if(fav)return fav.title;
  return currentVideoId||'';
}
function getCurrentUploader(){
  if(currentVideoData?.author)return currentVideoData.author;
  const item=document.querySelector(`.video-item[data-vid="${currentVideoId}"]`);
  if(item)return item.querySelector('p')?.textContent||'';
  return '';
}

function renderLists(){
  const el=$('listsContent');
  const lists=getLists(),history=getHistory(),favs=getFavs();
  let html=`<button class="btn" id="newListBtn">+ Nueva lista</button>`;
  html+=`<div class="pl-group"><div class="pl-header"><span class="name">❤️ Favoritos</span><span class="count">${favs.length}</span></div>
    <div class="pl-items"><div class="pl-items-inner">
    ${favs.length===0?'<div class="dl-empty">Sin favoritos</div>':
      favs.map(v=>`<div class="pl-item" data-vid="${esc(v.id)}" data-src="favs">
        <span class="title">${esc(v.title||v.id)}</span>
        <div class="ctrl"><button data-act="remove">✕</button></div>
      </div>`).join('')}
    </div></div></div>`;
  html+=`<div class="pl-group"><div class="pl-header"><span class="name">🕒 Historial</span><span class="count">${history.length}</span></div>
    <div class="pl-items"><div class="pl-items-inner">
    ${history.length===0?'<div class="dl-empty">Sin historial</div>':
      history.map(v=>`<div class="pl-item" data-vid="${esc(v.id)}" data-src="history">
        <span class="title">${esc(v.title||v.id)}</span>
        <div class="ctrl"><button data-act="remove">✕</button></div>
      </div>`).join('')}
    </div></div></div>`;
  lists.forEach(list=>{
    html+=`<div class="pl-group" data-key="list-${esc(list.id)}">
      <div class="pl-header" data-listid="${esc(list.id)}">
        <span class="name">📁 ${esc(list.name)}</span><span class="count">${list.items.length}</span>
        <div class="actions"><button data-act="rename">✏️</button><button data-act="delete">🗑️</button></div>
      </div>
      <div class="pl-items"><div class="pl-items-inner">
      ${list.items.length===0?'<div class="dl-empty">Lista vacía</div>':
        list.items.map((v,i)=>`<div class="pl-item" data-vid="${esc(v.id)}" data-src="${esc(list.id)}" data-idx="${i}">
          <span class="title">${esc(v.title||v.id)}</span>
          <div class="ctrl"><button data-act="up">↑</button><button data-act="down">↓</button><button data-act="remove">✕</button></div>
        </div>`).join('')}
      </div></div></div>`;
  });
  el.innerHTML=html;

  $('newListBtn').onclick=()=>{
    const n=prompt('Nombre de la lista:');
    if(!n||!n.trim())return;
    const l=getLists();
    l.push({id:Date.now().toString(36),name:n.trim(),items:[]});
    setLists(l);
  };
  el.querySelectorAll('.pl-header').forEach(h=>{
    h.addEventListener('click',e=>{
      if(e.target.closest('button'))return;
      h.closest('.pl-group').classList.toggle('expanded');
    });
  });
  el.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const act=btn.dataset.act;
      const header=btn.closest('.pl-header');
      const listId=header?.dataset.listid;
      if(act==='rename'&&listId){
        const list=getLists().find(l=>l.id===listId);if(!list)return;
        const n=prompt('Nuevo nombre:',list.name);
        if(n&&n.trim()){const all=getLists();all.find(l=>l.id===listId).name=n.trim();setLists(all);}
      }else if(act==='delete'&&listId){
        if(!confirm('¿Eliminar esta lista?'))return;
        setLists(getLists().filter(l=>l.id!==listId));
      }else if(act==='remove'){
        const item=btn.closest('.pl-item'),src=item.dataset.src,idx=parseInt(item.dataset.idx||'0',10);
        if(src==='history'){localStorage.setItem('nx_history',JSON.stringify(getHistory().filter(x=>x.id!==item.dataset.vid)));renderLists();}
        else if(src==='favs'){setFavs(getFavs().filter(x=>x.id!==item.dataset.vid));renderLists();updateLikeBtn();}
        else{const all=getLists();const l=all.find(x=>x.id===src);if(l){l.items.splice(idx,1);setLists(all);}}
      }else if(act==='up'||act==='down'){
        const item=btn.closest('.pl-item'),src=item.dataset.src,idx=parseInt(item.dataset.idx,10);
        const all=getLists();const l=all.find(x=>x.id===src);if(!l)return;
        const nIdx=act==='up'?idx-1:idx+1;
        if(nIdx<0||nIdx>=l.items.length)return;
        [l.items[idx],l.items[nIdx]]=[l.items[nIdx],l.items[idx]];
        setLists(all);
      }
    });
  });
  el.querySelectorAll('.pl-item').forEach(it=>{
    it.addEventListener('click',e=>{
      if(e.target.closest('button'))return;
      const vid=it.dataset.vid;
      if(vid)playVideo({type:'youtube',id:vid});
    });
  });
}
function addToList(video,listId){
  const all=getLists();const l=all.find(x=>x.id===listId);if(!l)return;
  if(l.items.some(i=>i.id===video.id)){toast('Ya está en la lista');return;}
  l.items.push({id:video.id,title:video.title,uploader:video.uploader||''});
  setLists(all);toast('✅ Añadido');
}
function showAddToList(video,anchor){
  document.querySelectorAll('.ctx-menu').forEach(m=>m.remove());
  const menu=document.createElement('div');
  menu.className='ctx-menu';
  const rect=anchor.getBoundingClientRect();
  menu.style.top=Math.min(rect.bottom+4,window.innerHeight-300)+'px';
  menu.style.left=Math.min(rect.left-100,window.innerWidth-220)+'px';
  let html='<div class="dl-list">';
  html+=`<div class="dl-item" data-new="1"><span class="q">+ Nueva lista</span></div>`;
  getLists().forEach(l=>{
    html+=`<div class="dl-item" data-lid="${esc(l.id)}"><span class="q">📁 ${esc(l.name)}</span></div>`;
  });
  html+='</div>';
  menu.innerHTML=html;
  document.body.appendChild(menu);
  const close=()=>{menu.remove();document.removeEventListener('click',outside);};
  const outside=e=>{if(!menu.contains(e.target)&&e.target!==anchor)close();};
  setTimeout(()=>document.addEventListener('click',outside),10);
  menu.querySelectorAll('.dl-item').forEach(item=>{
    item.addEventListener('click',()=>{
      if(item.dataset.new){
        const n=prompt('Nombre:');
        if(n&&n.trim()){
          const all=getLists();
          all.push({id:Date.now().toString(36),name:n.trim(),items:[video]});
          setLists(all);toast('✅ Lista creada');
        }
      }else{addToList(video,item.dataset.lid);}
      close();
    });
  });
}

async function loadTVList(type,code){
  const list=$('suggestionsList');
  tvCurrentView={type,code};
  list.innerHTML='<div class="loading-msg">Cargando canales...</div>';
  const url=type==='country'
    ?`https://iptv-org.github.io/iptv/countries/${code}.m3u`
    :`https://iptv-org.github.io/iptv/categories/${code}.m3u`;
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const text=await res.text();
    tvChannels=parseM3U(text);
    renderTVChannels(tvChannels);
  }catch(e){
    console.warn(e);
    list.innerHTML='<div class="empty-msg">❌ No se pudo cargar la lista</div>';
  }
}

function parseM3U(text){
  const lines=text.split('\n'),channels=[];let cur=null;
  for(const line of lines){
    const t=line.trim();
    if(t.startsWith('#EXTINF:')){
      cur={};
      const logo=t.match(/tvg-logo="([^"]*)"/);if(logo)cur.logo=logo[1];
      const group=t.match(/group-title="([^"]*)"/);if(group)cur.group=group[1];
      const nm=t.match(/,(.+)$/);if(nm)cur.name=nm[1];
    }else if(t&&!t.startsWith('#')&&cur){
      cur.url=t;
      if(cur.name&&cur.url)channels.push(cur);
      cur=null;
    }
  }
  return channels;
}

function renderTVChannels(channels){
  const list=$('suggestionsList');
  list.innerHTML='';
  // Sticky bar
  const bar=document.createElement('div');
  bar.className='tv-controls';
  bar.innerHTML=`
    <button class="tv-back" id="tvBack">← Volver</button>
    <input type="text" class="tv-search" id="tvSearch" placeholder="Buscar canal...">
  `;
  list.appendChild(bar);

  // Items
  const container=document.createElement('div');
  if(!channels.length){
    container.innerHTML='<div class="empty-msg">Sin canales</div>';
  }else{
    channels.slice(0,500).forEach((ch,i)=>{
      const el=document.createElement('div');
      el.className='channel-item';
      el.dataset.idx=i;
      el.innerHTML=`
        <img src="${esc(ch.logo||'')}" alt="" loading="lazy" onerror="this.style.opacity=0">
        <div class="info"><h4>${esc(ch.name)}</h4><p>${esc(ch.group||'')}</p></div>
      `;
      el.addEventListener('click',()=>{
        const c=channels[parseInt(el.dataset.idx,10)];
        if(c)playVideo({type:'tv',channel:c},{title:c.name});
      });
      container.appendChild(el);
    });
  }
  list.appendChild(container);

  $('tvBack').addEventListener('click',showTVNav);
  const search=$('tvSearch');
  search.addEventListener('input',()=>{
    const q=search.value.toLowerCase().trim();
    const filtered=q?channels.filter(c=>(c.name||'').toLowerCase().includes(q)):channels;
    // Re-render solo la lista, manteniendo barra
    while(container.firstChild)container.removeChild(container.firstChild);
    if(!filtered.length){
      container.innerHTML='<div class="empty-msg">Sin coincidencias</div>';
      return;
    }
    filtered.slice(0,500).forEach((ch,i)=>{
      const el=document.createElement('div');
      el.className='channel-item';
      el.innerHTML=`
        <img src="${esc(ch.logo||'')}" alt="" loading="lazy" onerror="this.style.opacity=0">
        <div class="info"><h4>${esc(ch.name)}</h4><p>${esc(ch.group||'')}</p></div>
      `;
      el.addEventListener('click',()=>playVideo({type:'tv',channel:ch},{title:ch.name}));
      container.appendChild(el);
    });
  });
}

function filterTVChannels(q){
  if(!tvChannels.length){toast('Carga una lista de canales primero');return;}
  const filtered=tvChannels.filter(c=>(c.name||'').toLowerCase().includes(q.toLowerCase()));
  renderTVChannels(filtered);
}

   Tabs sidebar
   ============================================================ */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab-pane').forEach(p=>{
    p.classList.toggle('active',p.id==='pane'+(name==='trending'?'Trending':'Lists'));
  });
  if(name==='lists')renderLists();
}
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>switchTab(b.dataset.tab));
});

/* ============================================================
   Descargas — Invidious (CORS OK)
   ============================================================ */
let dlData=null,dlTab='audio';

function openDLModal(){
  if(!currentVideoId){toast('Reproduce un video de YouTube primero');return;}
  $('dlBackdrop').classList.add('open');
  $('dlModal').classList.add('open');
  loadDLOptions();
}
function closeDLModal(){
  $('dlBackdrop').classList.remove('open');
  $('dlModal').classList.remove('open');
}
$('dlBtn').addEventListener('click',openDLModal);
$('dlClose').addEventListener('click',closeDLModal);
$('dlBackdrop').addEventListener('click',closeDLModal);

document.querySelectorAll('.dl-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.dl-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');dlTab=t.dataset.tab;renderDLList();
  });
});

async function loadDLOptions(){
  $('dlList').innerHTML='<div class="dl-empty">Obteniendo opciones...</div>';
  if(dlData&&dlData.videoId===currentVideoId){renderDLList();return;}
  dlData={videoId:currentVideoId,audio:[],video:[]};

  // Invidious primero (mejor y CORS-enabled vía latest_version)
  for(const base of INVIDIOUS){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),6000);
      const res=await fetch(`${base}/api/v1/videos/${currentVideoId}`,{signal:ctrl.signal});
      clearTimeout(t);
      if(!res.ok)continue;
      const data=await res.json();

      const audio=(data.adaptiveFormats||[])
        .filter(f=>f.type&&f.type.startsWith('audio/')&&(f.itag||f.url))
        .map(f=>({
          url:f.itag?`${base}/latest_version?id=${currentVideoId}&itag=${f.itag}&local=true`:f.url,
          quality:f.bitrate?Math.round(f.bitrate/1000)+' kbps':(f.audioQuality||'audio'),
          bitrate:f.bitrate?parseInt(f.bitrate):0,
          mime:f.type||'audio/mp4',
          size:f.contentLength?parseInt(f.contentLength):0
        }))
        .sort((a,b)=>b.bitrate-a.bitrate);

      const video=(data.formatStreams||[])
        .filter(f=>f.url||f.itag)
        .map(f=>({
          url:f.url||`${base}/latest_version?id=${currentVideoId}&itag=${f.itag}&local=true`,
          quality:f.resolution||f.qualityLabel||'video',
          mime:f.type||'video/mp4',
          size:f.contentLength?parseInt(f.contentLength):0
        }))
        .sort((a,b)=>(parseInt(b.quality)||0)-(parseInt(a.quality)||0));

      if(audio.length||video.length){
        dlData.audio=audio;dlData.video=video;
        renderDLList();
        return;
      }
    }catch(e){console.warn('Inv DL',base,e.message);}
  }

  // Fallback Piped
  try{
    const data=await pipedFetch('/streams/'+currentVideoId,7000);
    const audio=(data.audioStreams||[]).filter(s=>s.url).map(s=>({
      url:s.url,
      quality:s.quality||(s.bitrate?Math.round(s.bitrate/1000)+' kbps':'audio'),
      bitrate:s.bitrate||0,mime:s.mimeType||'',size:s.contentLength||0
    })).sort((a,b)=>b.bitrate-a.bitrate);
    const video=(data.videoStreams||[]).filter(s=>s.url&&!s.videoOnly).map(s=>({
      url:s.url,
      quality:s.quality||(s.height?s.height+'p':'video'),
      mime:s.mimeType||'',size:s.contentLength||0
    })).sort((a,b)=>(parseInt(b.quality)||0)-(parseInt(a.quality)||0));
    if(audio.length||video.length){
      dlData.audio=audio;dlData.video=video;
      renderDLList();
      return;
    }
  }catch(_){}

  $('dlList').innerHTML='<div class="dl-empty">❌ No se pudieron obtener opciones.<br><small>Intenta con otro video o espera unos segundos.</small></div>';
}

function renderDLList(){
  const list=$('dlList');
  if(!dlData)return;
  const streams=dlTab==='audio'?dlData.audio:dlData.video;
  if(!streams.length){list.innerHTML='<div class="dl-empty">Sin opciones disponibles en esta categoría</div>';return;}
  list.innerHTML=streams.map((s,i)=>`
    <div class="dl-item" data-i="${i}">
      <span class="q">${esc(s.quality)}</span>
      <span class="s">${s.size?fmtSize(s.size):'...'}</span>
    </div>
  `).join('');
  list.querySelectorAll('.dl-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const stream=streams[parseInt(el.dataset.i,10)];
      const title=getCurrentTitle();
      const ext=extMime(stream.mime);
      const safe=title.replace(/[\\/:*?"<>|]/g,'_').slice(0,80);
      closeDLModal();
      toast('⏳ Descargando...');
      downloadFile(stream.url,`${safe}.${ext}`);
    });
  });
}

async function downloadFile(url,filename){
  const attempts=[
    ()=>fetch(url).then(r=>r.ok?r.blob():Promise.reject('HTTP '+r.status)),
    ()=>fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url)).then(r=>r.ok?r.blob():Promise.reject()),
    ()=>fetch('https://cors.eu.org/'+url).then(r=>r.ok?r.blob():Promise.reject())
  ];
  for(const attempt of attempts){
    try{
      const blob=await attempt();
      if(blob.size<500)throw new Error('Blob muy pequeño');
      const objUrl=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=objUrl;a.download=filename;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(objUrl),30000);
      toast('✅ Descarga completada');
      return;
    }catch(e){console.warn('DL attempt:',e.message||e);}
  }
  // Fallback: abrir URL directa
  try{
    const a=document.createElement('a');
    a.href=url;a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    toast('↗️ Abriendo archivo en nueva pestaña');
  }catch(_){toast('❌ No se pudo descargar');}
}

  await _origPlay(src,opts);

    if(currentVideoId){

        title:getCurrentTitle(),
        uploader:getCurrentUploader()
      });

  },800);
};

async function playRandomInitial(){
  const history=getHistory();
  const lastPlayed=history[0];

  let trending=[];
  try{
    const data=await pipedFetch('/trending?region=US',6000);
    const items=Array.isArray(data)?data:(data.items||[]);
    trending=items.slice(0,30).map(i=>({
      id:extractId(i.url),title:i.title,uploader:i.uploaderName||i.uploader||'',
      thumbnail:i.thumbnail
    })).filter(i=>i.id);
  }catch(_){
    trending=FALLBACK_YT.map(v=>({
      id:v.id,title:v.title,uploader:v.uploader,
      thumbnail:`https://img.youtube.com/vi/${v.id}/mqdefault.jpg`
    }));
  }

  // Renderizar trending
  if(trending.length){
    renderResults(trending.map(t=>({
      ...t,platform:'youtube',
      thumbnail:t.thumbnail||`https://img.youtube.com/vi/${t.id}/mqdefault.jpg`
    })),'youtube');
  }

  if(!trending.length)return;

  // Preferencia por uploader del historial
  let pick=null;
  if(lastPlayed&&lastPlayed.uploader){
    const matching=trending.filter(t=>t.uploader===lastPlayed.uploader);
    if(matching.length)pick=matching[Math.floor(Math.random()*matching.length)];
  }
  if(!pick){
    const pool=trending.filter(t=>!recentlyPlayed.has(t.id));
    pick=(pool.length?pool:trending)[Math.floor(Math.random()*(pool.length||trending.length))];
  }
  if(!pick)return;

  const el=$('nativePlayer');
  try{el.muted=true;}catch(_){}
  await playVideo({type:'youtube',id:pick.id},{title:pick.title});
  try{el.muted=false;}catch(_){}
}

playRandomInitial();
