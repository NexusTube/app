<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#06b6d4">
    <meta name="description" content="NexusTube - Reproductor Next-Gen">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NexusTube - Next-Gen Player</title>
    <link rel="manifest" id="manifestLink">
    <link rel="icon" id="faviconLink" type="image/svg+xml">
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(56, 189, 248, 0.2);
            --success: #4ade80;
            --warn: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        body {
            background-color: var(--bg-color); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(147, 51, 234, 0.08) 0%, transparent 40%);
        }
        header {
            display: flex; align-items: center; gap: 1rem;
            padding: 1rem 2rem; border-bottom: 1px solid var(--border);
            background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100; flex-wrap: wrap; width: 100%;
        }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: .5rem; flex-shrink: 0; user-select: none; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        .search-container { display: flex; gap: .5rem; flex: 1 1 300px; min-width: 0; max-width: 700px; }
        .search-input {
            flex: 1 1 auto; min-width: 0; background: var(--panel-bg);
            border: 1px solid var(--border); padding: .75rem 1rem; border-radius: 8px;
            color: var(--text-main); font-size: 1rem; outline: none; transition: all .3s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .search-input::placeholder { color: var(--text-muted); }
        .btn {
            background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fff; border: none;
            padding: .75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: all .3s; box-shadow: 0 4px 12px rgba(6,182,212,.3); white-space: nowrap; font-size: .95rem;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }
        .btn:disabled { opacity: .6; cursor: wait; transform: none; }
        .btn-secondary { background: rgba(255,255,255,.08); box-shadow: none; border: 1px solid var(--border); }
        .btn-secondary:hover { background: rgba(255,255,255,.15); box-shadow: none; }
        #installBtn { display: none; }
        #installBtn.visible { display: inline-flex; }

        main { flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; padding: 2rem; display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }
        @media (max-width: 1024px) { main { grid-template-columns: 1fr; padding: 1rem; } }
        @media (max-width: 640px) {
            header { padding: .75rem 1rem; gap: .5rem; }
            .logo { font-size: 1.15rem; }
            .search-container { flex-basis: 100%; max-width: 100%; }
            .btn { padding: .7rem 1rem; font-size: .9rem; }
            main { padding: .75rem; }
        }

        .player-section { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
        .video-wrapper {
            position: relative; width: 100%; padding-top: 56.25%;
            background: #000; border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,.8), 0 0 20px rgba(6,182,212,.1);
        }
        #nativePlayer, #ytFrame, #ytFrame iframe {
            position: absolute; top: 0; left: 0;
            width: 100% !important; height: 100% !important; border: none;
        }
        #nativePlayer { object-fit: contain; background: #000; display: none; }
        .player-badge {
            position: absolute; top: .5rem; right: .5rem; z-index: 5;
            background: rgba(0,0,0,.7); padding: .35rem .7rem; border-radius: 6px;
            font-size: .75rem; border: 1px solid var(--border); backdrop-filter: blur(6px);
        }

        .controls-bar {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border); padding: 1rem; border-radius: 12px;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;
        }
        .control-group { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
        label { font-size: .85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 130px; background: rgba(255,255,255,.1); height: 6px; border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 8px var(--accent); }
        input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--accent); cursor: pointer; }
        #volumeNote { font-size: .75rem; font-style: italic; color: var(--text-muted); }

        #boostBtn.on { background: linear-gradient(135deg, #16a34a, #4ade80); box-shadow: 0 4px 12px rgba(74,222,128,.3); }

        .download-panel { background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; display: flex; flex-direction: column; gap: 1rem; }
        .download-panel h3 { font-size: 1rem; }
        .download-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
        .download-buttons .btn { flex: 1 1 200px; }

        .playlist-sidebar {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 1.5rem; max-height: 750px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 1rem;
        }
        .playlist-sidebar h3 { font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: .5rem; position: sticky; top: -1.5rem; background: var(--panel-bg); padding-top: .25rem; z-index: 2; }
        .video-item { display: flex; gap: .75rem; cursor: pointer; padding: .5rem; border-radius: 8px; transition: background .2s; }
        .video-item:hover { background: rgba(255,255,255,.05); }
        .video-item.active { background: rgba(6,182,212,.15); }
        .video-item img { width: 100px; height: 60px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #111; }
        .video-item-info { min-width: 0; }
        .video-item-info h4 { font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-item-info p { font-size: .75rem; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loading-msg, .empty-msg { color: var(--text-muted); font-size: .85rem; text-align: center; padding: 1rem; }

        .toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(150%);
            background: rgba(15,23,42,.95); border: 1px solid var(--accent); color: var(--text-main);
            padding: .85rem 1.5rem; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6);
            transition: transform .35s; z-index: 999; max-width: 90vw; font-size: .9rem; text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(6,182,212,.3); border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div class="logo">NEXUS<span>TUBE</span></div>
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Busca por nombre o pega un link de YouTube...">
        <button class="btn" id="loadBtn">Cargar</button>
    </div>
    <button class="btn btn-secondary" id="installBtn">📲 Instalar App</button>
</header>

<main>
    <div class="player-section">
        <div class="video-wrapper" id="videoWrapper">
            <!-- Iframe YouTube (por defecto, fiable) -->
            <div id="ytFrame"></div>
            <!-- Motor nativo (solo cuando Boost está activo) -->
            <video id="nativePlayer" playsinline controls></video>
            <div class="player-badge" id="playerBadge" style="display:none;"></div>
        </div>

        <div class="controls-bar">
            <div class="control-group">

            </div>
            <div class="control-group">
                <button class="btn btn-secondary" id="boostBtn">🚀 Boost 500%</button>
                <button class="btn btn-secondary" id="fsBtn">⛶ Pantalla Completa</button>
            </div>
        </div>

        <div class="download-panel">
            <h3>Descargas Multimedia</h3>
            <div class="download-buttons">
                <button id="dlMp3" class="btn">📥 Descargar MP3 (Audio)</button>
                <button id="dlMp4" class="btn">📥 Descargar MP4 (Video)</button>
            </div>
        </div>
    </div>

    <aside class="playlist-sidebar">
        <h3 id="sidebarTitle">🔥 Tendencias</h3>
        <div id="suggestionsList"><div class="loading-msg">Cargando tendencias...</div></div>
    </aside>
</main>

<div class="toast" id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ============================================================
   1) PWA
   ============================================================ */
(function setupPWA(){
    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="96" fill="#030712"/>
        <polygon points="200,150 380,256 200,362" fill="#06b6d4"/>
        <text x="256" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="#f8fafc">NEXUS</text>
    </svg>`;
    const iconDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
    document.getElementById('faviconLink').href = iconDataUrl;

    const manifest = {
        name:'NexusTube', short_name:'NexusTube', start_url:location.pathname, scope:'./',
        display:'standalone', orientation:'any', background_color:'#030712', theme_color:'#06b6d4', lang:'es',
        icons:[
            { src: iconDataUrl, sizes:'192x192', type:'image/svg+xml', purpose:'any' },
            { src: iconDataUrl, sizes:'512x512', type:'image/svg+xml', purpose:'any maskable' }
        ]
    };
    document.getElementById('manifestLink').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));

    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => {
                if (e.request.method !== 'GET') return;
                e.respondWith(caches.match(e.request).then(c => c || fetch(e.request).then(r => {
                    try { if (r.ok && new URL(e.request.url).origin === location.origin) {
                        const cl = r.clone(); caches.open('nexustube-v1').then(ca => ca.put(e.request, cl));
                    }} catch(_){}
                    return r;
                }).catch(() => caches.match('./'))));
            });`;
        try {
            const swUrl = URL.createObjectURL(new Blob([swCode], {type:'application/javascript'}));
            navigator.serviceWorker.register(swUrl).catch(()=>{});
        } catch(_){}
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); deferredPrompt = e; installBtn.classList.add('visible');
    });
    installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch(_){}
        deferredPrompt = null; installBtn.classList.remove('visible');
    });
})();

/* ============================================================
   2) Utilidades
   ============================================================ */
const $ = id => document.getElementById(id);
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showToast(msg, ms=3000) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function parseVideoId(input) {
    if (!input) return null;
    input = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
        /[?&]v=([a-zA-Z0-9_-]{11})/
    ];
    for (const p of patterns) {
        const m = input.match(p);
        if (m && m[1]) return m[1];
    }
    return null;
}
function extractIdFromUrl(path) {
    if (!path) return null;
    const m = path.match(/[?&]v=([a-zA-Z0-9_-]{11})/) || path.match(/([a-zA-Z0-9_-]{11})(?:[?&]|$)/);
    return m ? m[1] : null;
}

/* ============================================================
   3) Estado
   ============================================================ */
let player = null;                // YT.Player
let playerMode = 'none';          // 'iframe' | 'native' | 'none'
let currentVideoId = 'jfKfPfyJRdk';
let ytApiReady = false;
let pendingIframeVideo = null;
let currentVolume = 100;
let boostEnabled = false;         // OFF por defecto → iframe fiable
let loadToken = 0;

let currentPlaylist = [];
let isAutoAdvancing = false;

// Web Audio
let audioCtx = null, gainNode = null, mediaSourceNode = null, connectedVideoEl = null;

/* ============================================================
   4) IFrame (motor principal)
   ============================================================ */
window.onYouTubeIframeAPIReady = function () {
    ytApiReady = true;
    if (pendingIframeVideo) {
        const vid = pendingIframeVideo; pendingIframeVideo = null;
        createIframePlayer(vid);
    } else {
        createIframePlayer(currentVideoId);
    }
};

function createIframePlayer(videoId) {
    const el = $('nativePlayer');
    if (el) { try { el.pause(); } catch(_){} el.style.display = 'none'; }
    $('ytFrame').style.display = 'block';
    playerMode = 'iframe';
    updateVolumeUI();
    $('playerBadge').style.display = 'block';
    $('playerBadge').textContent = '📺 Modo normal';

    player = new YT.Player('ytFrame', {
        videoId: videoId,
        width: '100%',
        height: '100%',
        playerVars: {
            autoplay: 0,
            controls: 1,
            modestbranding: 1,
            rel: 0,
            iv_load_policy: 3,
            playsinline: 1
        },
        events: {
            'onReady': (e) => e.target.setVolume(Math.min(100, currentVolume)),
            'onStateChange': (e) => {
                if (e.data === 0) {
                    console.log('[iframe] Video terminado → siguiente');
                    handleVideoEnded();
                }
            },
            'onError': (e) => console.warn('[YT] Error', e.data)
        }
    });
}

function tryIframePlayer(videoId) {
    const el = $('nativePlayer');
    if (el) {
        try { el.pause(); } catch(_){}
        try { el.removeAttribute('src'); el.load(); } catch(_){}
        el.style.display = 'none';
    }
    $('ytFrame').style.display = 'block';
    playerMode = 'iframe';
    updateVolumeUI();
    $('playerBadge').style.display = 'block';
    $('playerBadge').textContent = '📺 Modo normal';

    if (player && player.loadVideoById) {
        player.loadVideoById(videoId);
        try { player.setVolume(Math.min(100, currentVolume)); } catch(_){}
    } else if (ytApiReady) {
        createIframePlayer(videoId);
    } else {
        pendingIframeVideo = videoId;
    }
}

/* ============================================================
   5) Motor NATIVO (solo con Boost activo)
   ============================================================ */
async function tryNativePlayer(videoId) {
    try {
        const data = await pipedFetch(`/streams/${videoId}`, 4500);
        if (data.livestream || (data.hls && !data.videoStreams)) return false;

        const streams = data.videoStreams || data.videos || [];
        const muxed = streams.filter(s => !s.videoOnly && s.url);
        if (!muxed.length) return false;

        muxed.sort((a, b) => {
            const a720 = Math.abs((a.height || 0) - 720);
            const b720 = Math.abs((b.height || 0) - 720);
            if (a720 !== b720) return a720 - b720;
            return (b.height || 0) - (a.height || 0);
        });
        const chosen = muxed[0];

        const el = $('nativePlayer');
        el.pause();
        try { el.removeAttribute('src'); el.load(); } catch(_){}
        el.crossOrigin = 'anonymous';

        const loaded = await new Promise((resolve) => {
            let done = false;
            const finish = (ok) => { if (!done) { done = true; resolve(ok); } };
            el.addEventListener('loadedmetadata', () => finish(true), { once: true });
            el.addEventListener('error', () => finish(false), { once: true });
            setTimeout(() => finish(false), 8000);
            el.src = chosen.url;
        });

        if (!loaded) { try { el.removeAttribute('src'); el.load(); } catch(_){} return false; }

        $('ytFrame').style.display = 'none';
        el.style.display = 'block';
        if (player && player.pauseVideo) { try { player.pauseVideo(); } catch(_){} }

        const boosted = setupAudioBoost(el);
        playerMode = 'native';
        updateVolumeUI();
        $('playerBadge').textContent = boosted ? '🎬 Nativo • 500% real' : '🎬 Nativo • cap 100%';

        try {
            await el.play();
        } catch(e) {
            try { el.muted = true; await el.play(); } catch(_){}
        }
        return true;
    } catch (err) {
        console.warn('[native]', err.message);
        return false;
    }
}

function setupAudioBoost(videoEl) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (connectedVideoEl !== videoEl) {
            if (mediaSourceNode) { try { mediaSourceNode.disconnect(); } catch(_){} }
            mediaSourceNode = audioCtx.createMediaElementSource(videoEl);
            gainNode = audioCtx.createGain();
            mediaSourceNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            connectedVideoEl = videoEl;
        }
        gainNode.gain.value = currentVolume / 100;
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
        return true;
    } catch (e) {
        console.warn('Boost no disponible:', e.message);
        gainNode = null;
        return false;
    }
}

/* ============================================================
   6) Dispatcher de reproducción
   ============================================================ */
async function loadVideo(videoId) {
    const id = parseVideoId(videoId);
    if (!id) { showToast('❌ Link o ID inválido'); return; }

    const token = ++loadToken;
    currentVideoId = id;
    highlightActiveItem(id);

    // Modo normal (por defecto): iframe directo, sin esperas
    if (!boostEnabled) {
        tryIframePlayer(id);
        return;
    }

    // Boost solicitado: intentar nativo con timeout corto
    $('playerBadge').textContent = '⏳ Cargando boost...';
    const ok = await tryNativePlayer(id);
    if (token !== loadToken) return;

    if (!ok) {
        showToast('⚠️ Boost no disponible, vuelvo a modo normal');
        boostEnabled = false;
        updateBoostBtn();
        tryIframePlayer(id);
    }
}

/* ============================================================
   7) Autoplay siguiente
   ============================================================ */
function handleVideoEnded() {
    if (isAutoAdvancing) return;
    if (!currentPlaylist.length) return;
    isAutoAdvancing = true;

    let idx = currentPlaylist.findIndex(v => v.id === currentVideoId);
    const nextIdx = (idx + 1) % currentPlaylist.length;
    const next = currentPlaylist[nextIdx];

    if (!next || next.id === currentVideoId) {
        isAutoAdvancing = false;
        if (playerMode === 'native') {
            const v = $('nativePlayer');
            if (v) { v.currentTime = 0; v.play().catch(()=>{}); }
        } else if (player && player.seekTo) {
            player.seekTo(0); player.playVideo();
        }
        return;
    }

    showToast(`▶️ ${next.title.slice(0, 60)}`, 2500);
    setTimeout(async () => {
        await loadVideo(next.id);
        isAutoAdvancing = false;
    }, 400);
}

/* ============================================================
   8) Volumen (iframe cap 100 / native hasta 500 real)
   ============================================================ */
const volumeRange = $('volumeRange');
const volumeVal = $('volumeVal');
const volumeNote = $('volumeNote');

function updateVolumeUI() {
    if (playerMode === 'native' && gainNode) {
        volumeNote.textContent = '🚀 Boost real activo';
        volumeNote.style.color = 'var(--success)';
    } else if (playerMode === 'native') {
        volumeNote.textContent = '⚠️ Cap 100%';
        volumeNote.style.color = 'var(--warn)';
    } else if (playerMode === 'iframe') {
        volumeNote.textContent = currentVolume > 100 ? '💡 Activa Boost para >100%' : '🔒 Cap 100%';
        volumeNote.style.color = 'var(--warn)';
    } else {
        volumeNote.textContent = '';
    }
}

function updateBoostBtn() {
    const btn = $('boostBtn');
    if (boostEnabled) {
        btn.textContent = '🔊 Boost ON';
        btn.classList.add('on');
    } else {
        btn.textContent = '🚀 Boost 500%';
        btn.classList.remove('on');
    }
}

volumeRange.addEventListener('input', async (e) => {
    const val = parseInt(e.target.value, 10);
    currentVolume = val;
    volumeVal.textContent = val + '%';

    if (playerMode === 'iframe') {
        updateVolumeUI();
        if (player && player.setVolume) {
            try { player.setVolume(Math.min(100, val)); } catch(_){}
        }
    } else if (playerMode === 'native' && gainNode) {
        if (audioCtx && audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch(_){}
        }
        gainNode.gain.value = val / 100;
        const v = $('nativePlayer');
        if (v) v.volume = 1;
        updateVolumeUI();
    } else if (playerMode === 'native') {
        const v = $('nativePlayer');
        if (v) v.volume = Math.min(1, val / 100);
        updateVolumeUI();
    }
});

$('boostBtn').addEventListener('click', async () => {
    boostEnabled = !boostEnabled;
    updateBoostBtn();
    await loadVideo(currentVideoId);
});

/* ============================================================
   9) Piped API
   ============================================================ */
const PIPED_INSTANCES = [
    'https://pipedapi.kavin.rocks',
    'https://pipedapi.adminforge.de',
    'https://api.piped.private.coffee',
    'https://pipedapi.reallyaweso.me',
    'https://pipedapi.drgns.space',
    'https://pipedapi.leptons.xyz'
];

async function pipedFetch(path, timeoutMs = 8000) {
    const errors = [];
    for (const base of PIPED_INSTANCES) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
            const res = await fetch(base + path, { signal: ctrl.signal });
            clearTimeout(timer);
            if (!res.ok) { errors.push(`${base}: HTTP ${res.status}`); continue; }
            return await res.json();
        } catch (err) {
            clearTimeout(timer);
            errors.push(`${base}: ${err.message}`);
        }
    }
    console.warn('Piped falló:', errors);
    throw new Error('Servidores no disponibles');
}

/* ============================================================
   10) Sidebar
   ============================================================ */
function renderResults(items, titleText) {
    const list = $('suggestionsList');
    const title = $('sidebarTitle');
    if (titleText) title.textContent = titleText;

    list.innerHTML = '';
    currentPlaylist = [];

    if (!Array.isArray(items) || items.length === 0) {
        list.innerHTML = '<div class="empty-msg">Sin resultados.</div>';
        return;
    }

    items.forEach(item => {
        const id = extractIdFromUrl(item.url);
        if (!id) return;

        currentPlaylist.push({
            id,
            title: item.title || 'Sin título',
            uploader: item.uploaderName || item.uploader || ''
        });

        const div = document.createElement('div');
        div.className = 'video-item';
        div.dataset.videoId = id;
        const thumb = item.thumbnail || `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
        div.innerHTML = `
            <img src="${escapeHtml(thumb)}" alt="" loading="lazy"
                 onerror="this.src='https://img.youtube.com/vi/${id}/mqdefault.jpg'">
            <div class="video-item-info">
                <h4>${escapeHtml(item.title || 'Sin título')}</h4>
                <p>${escapeHtml(item.uploaderName || item.uploader || '')}</p>
            </div>`;
        div.addEventListener('click', () => {
            isAutoAdvancing = false;
            loadVideo(id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        list.appendChild(div);
    });

    highlightActiveItem(currentVideoId);
}

function highlightActiveItem(id) {
    document.querySelectorAll('.video-item').forEach(el => {
        el.classList.toggle('active', el.dataset.videoId === id);
    });
}

/* ============================================================
   11) Tendencias
   ============================================================ */
const FALLBACK_TRENDING = [
    { id:'jfKfPfyJRdk', title:'Lofi Hip Hop Radio - Beats to Relax/Study to', uploader:'Lofi Girl' },
    { id:'dQw4w9WgXcQ', title:'Rick Astley - Never Gonna Give You Up', uploader:'Rick Astley' },

    { id:'kJQP7kiw5Fk', title:'Luis Fonsi - Despacito ft. Daddy Yankee', uploader:'Luis Fonsi' }
];

async function loadTrending() {
    try {
        const data = await pipedFetch('/trending?region=US');
        const items = Array.isArray(data) ? data : (data.items || []);
        if (items.length > 0) { renderResults(items.slice(0, 20), '🔥 Tendencias'); return; }
        throw new Error('Sin datos');
    } catch (err) {
        const fallback = FALLBACK_TRENDING.map(v => ({
            url: '/watch?v=' + v.id, title: v.title,
            uploaderName: v.uploader,
            thumbnail: `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`
        }));
        renderResults(fallback, '🔥 Sugerencias');
    }
}

/* ============================================================
   12) Búsqueda
   ============================================================ */
async function performSearch(query) {
    query = (query || '').trim();
    if (!query) { showToast('Escribe un nombre o pega un link'); return; }

    const directId = parseVideoId(query);
    if (directId) { loadVideo(directId); showToast('▶️ Video cargado'); return; }

    const list = $('suggestionsList');
    $('sidebarTitle').textContent = `🔎 Resultados: "${query}"`;
    list.innerHTML = '<div class="loading-msg">Buscando...</div>';

    try {
        const data = await pipedFetch('/search?q=' + encodeURIComponent(query) + '&filter=videos');
        const items = data.items || [];
        renderResults(items.slice(0, 25), `🔎 Resultados: "${query}"`);
        if (items.length === 0) showToast('Sin resultados');
    } catch (err) {
        list.innerHTML = `<div class="empty-msg">❌ Servidores no disponibles.<br>Pega un link directo mientras tanto.</div>`;
    }
}

/* ============================================================
   13) Descargas
   ============================================================ */
const COBALT_ENDPOINTS = [
    'https://api.cobalt.tools/',
    'https://cobalt-api.kwiatekmiki.com/',
    'https://cobalt-api.meowing.de/',
    'https://cobalt-api.ayo.tf/'
];

async function tryCobalt(videoId, mode) {
    const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;
    const bodies = [
        { url: videoUrl, videoQuality:'720', downloadMode: mode==='audio'?'audio':'auto', audioFormat:'mp3', filenameStyle:'basic' },
        { url: videoUrl, isAudioOnly: mode==='audio' }
    ];
    for (const ep of COBALT_ENDPOINTS) {
        for (const body of bodies) {
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 12000);
                const res = await fetch(ep, {
                    method:'POST',
                    headers:{ 'Accept':'application/json', 'Content-Type':'application/json' },
                    body: JSON.stringify(body),
                    signal: ctrl.signal
                });
                clearTimeout(t);
                if (!res.ok) continue;
                const data = await res.json();
                if (data.error) continue;
                if (data.url) return data.url;
                if (data.status === 'tunnel' && data.url) return data.url;
            } catch(_) {}
        }
    }
    return null;
}

async function handleDownload(mode, btn) {
    if (!currentVideoId) { showToast('Carga un video primero'); return; }
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ Preparando...';
    try {
        const url = await tryCobalt(currentVideoId, mode);
        if (url) {
            btn.textContent = '✅ Iniciando...';
            const a = document.createElement('a');
            a.href = url; a.target = '_blank'; a.rel = 'noopener';
            document.body.appendChild(a); a.click(); a.remove();
            showToast('✅ Descarga iniciada');
        } else {
            const fallback = mode === 'audio'
                ? `https://yt-download.org/api/button/mp3/${currentVideoId}`
                : `https://yt-download.org/api/button/mp4/${currentVideoId}`;
            window.open(fallback, '_blank', 'noopener');
            showToast('↗️ Generador alternativo abierto');
        }
    } catch (err) {
        showToast('❌ No se pudo preparar la descarga');
    } finally {
        setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
    }
}

/* ============================================================
   14) Pantalla completa + orientación
   ============================================================ */
function lockOrientation(mode) {
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock(mode).catch(err => console.log(`[orient] ${mode}:`, err.message));
    }
}
function unlockOrientation() {
    if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch(_){}
    }
}

async function enterFullscreen() {
    const wrapper = $('videoWrapper');
    if (wrapper.requestFullscreen) await wrapper.requestFullscreen();
    else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
    setTimeout(() => lockOrientation('landscape'), 100);
}

async function exitFullscreen() {
    if (document.fullscreenElement) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else if (document.webkitFullscreenElement) {
        document.webkitExitFullscreen();
    }
    setTimeout(() => {
        lockOrientation('portrait');
        setTimeout(() => unlockOrientation(), 800);
    }, 200);
}

$('fsBtn').addEventListener('click', async () => {
    try {
        const isFull = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFull) await enterFullscreen();
        else await exitFullscreen();
    } catch(e) { console.warn(e); }
});

function onFullscreenChange() {
    const isFull = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFull) {
        setTimeout(() => {
            lockOrientation('portrait');
            setTimeout(() => unlockOrientation(), 800);
        }, 200);
    }
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

/* ============================================================
   15) Eventos y arranque
   ============================================================ */
$('loadBtn').addEventListener('click', () => performSearch($('searchInput').value));
$('searchInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') { e.preventDefault(); performSearch($('searchInput').value); }
});
$('dlMp3').addEventListener('click', e => handleDownload('audio', e.currentTarget));
$('dlMp4').addEventListener('click', e => handleDownload('video', e.currentTarget));

$('nativePlayer').addEventListener('ended', () => {
    console.log('[native] Video terminado → siguiente');
    handleVideoEnded();
});
$('nativePlayer').addEventListener('play', () => { isAutoAdvancing = false; });

loadTrending();
updateBoostBtn();
updateVolumeUI();
</script>
