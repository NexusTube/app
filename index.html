<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#06b6d4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NexusTube</title>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://pipedapi.kavin.rocks" crossorigin>
<link rel="manifest" id="manifestLink">
<link rel="icon" id="faviconLink" type="image/svg+xml">
<style>
:root{--bg:#030712;--panel:rgba(15,23,42,.75);--accent:#06b6d4;--glow:rgba(6,182,212,.5);
  --text:#f8fafc;--muted:#94a3b8;--border:rgba(56,189,248,.2);--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  background-image:radial-gradient(circle at 10% 20%,rgba(6,182,212,.08) 0%,transparent 40%),
                   radial-gradient(circle at 90% 80%,rgba(147,51,234,.08) 0%,transparent 40%)}
body.christmas{--accent:#fbbf24;--glow:rgba(251,191,36,.5);--border:rgba(251,191,36,.3);
  background-image:radial-gradient(circle at 10% 20%,rgba(16,185,129,.1) 0%,transparent 40%),
                   radial-gradient(circle at 90% 80%,rgba(239,68,68,.08) 0%,transparent 40%),
                   radial-gradient(circle at 50% 50%,rgba(251,191,36,.05) 0%,transparent 60%)}
body.christmas .logo span{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.7)}
body.christmas .btn{background:linear-gradient(135deg,#059669,#10b981)}
header{display:flex;align-items:center;gap:1rem;padding:1rem 2rem;border-bottom:1px solid var(--border);
  background:rgba(3,7,18,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;flex-wrap:wrap;width:100%}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:.5rem;flex-shrink:0;user-select:none}
.logo span{color:var(--accent);text-shadow:0 0 10px var(--glow)}
.search-container{display:flex;gap:.5rem;flex:1 1 300px;min-width:0;max-width:700px}
.search-input{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--border);padding:.75rem 1rem;
  border-radius:8px;color:var(--text);font-size:1rem;outline:none;transition:all .3s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 15px var(--glow)}
.btn{background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;border:none;padding:.75rem 1.5rem;
  border-radius:8px;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 12px rgba(6,182,212,.3);
  white-space:nowrap;font-size:.95rem;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--glow)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn-secondary{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--border)}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:15px;display:inline-flex;
  align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.icon-btn:hover{background:rgba(6,182,212,.2);border-color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
#installBtn{display:none}#installBtn.visible{display:inline-flex}
#dlBtn{display:none;}
#dlBtn.visible{display:inline-flex;}
.platforms-bar{display:flex;gap:.35rem;padding:.5rem 2rem;overflow-x:auto;background:rgba(3,7,18,.5);
  border-bottom:1px solid var(--border);scrollbar-width:none}
.platforms-bar::-webkit-scrollbar{display:none}
.plat-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
  padding:.4rem .85rem;border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .2s;flex-shrink:0}
.plat-btn:hover{background:rgba(6,182,212,.1);color:var(--text)}
.plat-btn.active{background:rgba(6,182,212,.2);color:var(--accent);border-color:var(--accent)}
main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:2rem;display:grid;grid-template-columns:1fr 360px;gap:2rem}
@media(max-width:1024px){main{grid-template-columns:1fr;padding:1rem}}
@media(max-width:640px){header{padding:.75rem 1rem;gap:.5rem}.platforms-bar{padding:.4rem 1rem}
  .logo{font-size:1.15rem}.search-container{flex-basis:100%;max-width:100%}
  .btn{padding:.7rem 1rem;font-size:.9rem}main{padding:.75rem}.icon-btn{width:32px;height:32px;font-size:13px}}
.player-section{display:flex;flex-direction:column;gap:1rem;min-width:0}
.video-wrapper{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden;
  border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 20px rgba(6,182,212,.1);touch-action:pan-y;}
.video-wrapper.swiping{touch-action:none;}
#nativePlayer,#embedPlayer{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
#nativePlayer{object-fit:contain;background:#000;display:none;z-index:1;transition:filter .1s}
#embedPlayer{display:none;z-index:2;background:#000;transition:filter .1s}
#embedPlayer iframe,#embedPlayer > div{width:100%!important;height:100%!important;border:0;display:block;
  position:absolute!important;top:0!important;left:0!important;z-index:2}

/* Overlay de Gestos - Vertical en los lados */
.gesture-overlay{position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:.8rem .7rem;border-radius:12px;
  display:none;flex-direction:column;align-items:center;z-index:30;pointer-events:none;
  border:1px solid rgba(255,255,255,.25);box-shadow:0 4px 20px rgba(0,0,0,.6);min-width:58px;}
.gesture-overlay.show{display:flex;}
.gesture-overlay.volume{right:12px;}
.gesture-overlay.brightness{left:12px;}
.gesture-icon{font-size:1.3rem;margin-bottom:.4rem;}
.gesture-text{font-size:.8rem;font-weight:700;margin-bottom:.4rem;}
.gesture-bar{width:8px;height:100px;background:rgba(255,255,255,.25);border-radius:4px;position:relative;overflow:hidden;}
.gesture-fill{position:absolute;bottom:0;left:0;width:100%;background:var(--accent);height:50%;transition:height .1s;}

.exit-fs-btn{position:fixed;top:16px;right:16px;z-index:2147483647;width:46px;height:46px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:22px;line-height:1;
  cursor:pointer;display:none;align-items:center;justify-content:center;transition:opacity .3s,background .2s;
  opacity:.4;font-weight:300}
.exit-fs-btn.visible{display:flex}
.exit-fs-btn:hover{opacity:1;background:rgba(6,182,212,.85)}
.controls-bar{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  padding:.75rem 1rem;border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
.control-group{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
label{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;background:rgba(255,255,255,.1);height:6px;border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:0 0 8px var(--accent)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
#volVal{font-size:.85rem;color:var(--text);font-weight:600;min-width:42px;text-align:right}
#volNote{font-size:.72rem;color:var(--muted);font-style:italic}
.video-info{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:12px;padding:1rem 1.2rem;display:none}
.video-info.visible{display:block}
.video-info h2{font-size:1.1rem;font-weight:700;margin-bottom:.5rem;line-height:1.35}
.video-info .meta{font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
.video-info .desc{font-size:.85rem;color:var(--text);line-height:1.5;max-height:4.5rem;overflow:hidden;
  white-space:pre-wrap;word-wrap:break-word;transition:max-height .3s}
.video-info .desc.expanded{max-height:500px;overflow-y:auto}
.video-info .toggle-desc{background:none;border:none;color:var(--accent);cursor:pointer;
  font-size:.8rem;margin-top:.4rem;padding:0;font-weight:600;display:none}
.playlist-sidebar{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:12px;padding:0;max-height:750px;display:flex;flex-direction:column;overflow:hidden}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{flex:1;background:none;border:none;color:var(--muted);padding:.9rem .3rem;cursor:pointer;
  font-weight:600;font-size:.8rem;transition:all .2s;border-bottom:2px solid transparent}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(6,182,212,.05)}
.tab-pane{display:none;padding:1.1rem;overflow-y:auto;flex:1}
.tab-pane.active{display:block}
.video-item{display:flex;gap:.75rem;cursor:pointer;padding:.5rem;border-radius:8px;transition:background .2s;
  align-items:flex-start;position:relative}
.video-item:hover{background:rgba(255,255,255,.05)}
.video-item.active{background:rgba(6,182,212,.15)}
.thumb-wrap{position:relative;width:120px;height:68px;flex-shrink:0;background:#111;border-radius:4px;overflow:hidden}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.duration{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.85);color:#fff;
  padding:1px 4px;border-radius:3px;font-size:.65rem;font-weight:600}
.video-item-info{min-width:0;flex:1}
.video-item-info h4{font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.25}
.video-item-info p{font-size:.74rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-item-actions{display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .2s}
.video-item:hover .video-item-actions{opacity:1}
.video-item-actions button{background:rgba(0,0,0,.5);border:none;color:#fff;width:24px;height:24px;
  border-radius:4px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.platform-tag{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.8);
  padding:1px 5px;border-radius:3px;font-size:.6rem;font-weight:700;color:var(--accent);letter-spacing:.03em}
.loading-msg,.empty-msg{color:var(--muted);font-size:.85rem;text-align:center;padding:1rem}
.tv-controls{position:sticky;top:-1.1rem;background:var(--panel);padding:.7rem 1.1rem;margin:-1.1rem -1.1rem .5rem;
  z-index:10;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem}
.tv-back{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;font-weight:600;
  padding:0;text-align:left;align-self:flex-start}
.tv-search{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:.45rem .7rem;border-radius:6px;font-size:.8rem;outline:none;width:100%}
.tv-search:focus{border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.tv-global-search{background:rgba(6,182,212,.1);border:1px solid var(--accent);color:var(--text);
  padding:.6rem .8rem;border-radius:6px;font-size:.85rem;outline:none;width:100%;margin-bottom:.75rem}
.tv-nav{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:1rem}
.tv-nav-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  padding:.5rem;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s}
.tv-nav-btn:hover{background:rgba(6,182,212,.15);border-color:var(--accent)}
.channel-item{display:flex;gap:.65rem;align-items:center;padding:.5rem;border-radius:6px;cursor:pointer;
  transition:background .15s;border:1px solid transparent}
.channel-item:hover{background:rgba(255,255,255,.05)}
.channel-item.active{background:rgba(6,182,212,.18);border-color:var(--accent)}
.channel-item img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.05);flex-shrink:0}
.channel-item .info{flex:1;min-width:0}
.channel-item .info h4{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.channel-item .info p{font-size:.7rem;color:var(--muted);margin-top:2px}
.tv-count{font-size:.72rem;color:var(--muted);padding:.25rem 0}
.pl-group{margin-bottom:1rem;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:rgba(0,0,0,.15)}
.pl-header{display:flex;align-items:center;justify-content:space-between;padding:.65rem .85rem;cursor:pointer;
  background:rgba(255,255,255,.03);transition:background .2s;gap:.5rem}
.pl-header:hover{background:rgba(6,182,212,.1)}
.pl-header .name{font-weight:600;font-size:.88rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-header .count{font-size:.72rem;color:var(--muted);flex-shrink:0}
.pl-header .actions{display:flex;gap:3px;flex-shrink:0}
.pl-header .actions button{background:none;border:none;color:var(--muted);width:24px;height:24px;
  border-radius:4px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.pl-items{max-height:0;overflow:hidden;transition:max-height .3s ease}
.pl-group.expanded .pl-items{max-height:2000px;overflow-y:auto}
.pl-items-inner{padding:.35rem}
.pl-item{display:flex;align-items:center;gap:.4rem;padding:.4rem .5rem;border-radius:4px;
  cursor:pointer;font-size:.8rem;transition:background .15s}
.pl-item:hover{background:rgba(255,255,255,.05)}
.pl-item .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-item .ctrl{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .15s}
.pl-item:hover .ctrl{opacity:1}
.pl-item .ctrl button{background:none;border:none;color:var(--muted);width:20px;height:20px;
  cursor:pointer;font-size:11px;border-radius:3px;display:flex;align-items:center;justify-content:center}
#newListBtn{width:100%;margin-bottom:1rem}
.ctx-menu{position:fixed;background:rgba(10,15,28,.98);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:10px;padding:.4rem;z-index:1000;
  min-width:200px;max-width:92vw;max-height:60vh;overflow-y:auto;box-shadow:0 15px 40px rgba(0,0,0,.85)}
.dl-list{display:flex;flex-direction:column;gap:2px}
.dl-item{display:flex;justify-content:space-between;align-items:center;padding:.6rem .75rem;
  border-radius:6px;cursor:pointer;font-size:.85rem;transition:background .15s;gap:.5rem}
.dl-item:hover{background:rgba(6,182,212,.15)}
.dl-item .q{font-weight:600}
.dl-item .s{color:var(--muted);font-size:.72rem;flex-shrink:0}
.dl-empty{padding:1rem;text-align:center;color:var(--muted);font-size:.85rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(150%);
  background:rgba(15,23,42,.96);border:1px solid var(--accent);color:var(--text);padding:.85rem 1.5rem;
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .35s;z-index:9999;
  max-width:90vw;font-size:.9rem;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(6,182,212,.3);border-radius:4px}
.custom-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.custom-modal.open{display:flex;}
.custom-modal-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.5rem;max-width:400px;width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.8);}
.custom-modal-box p{font-size:1rem;margin-bottom:1.5rem;}
.custom-modal-actions{display:flex;gap:1rem;justify-content:center;}
</style>
</head>
<body>

<header>
  <div class="logo">NEXUS<span>TUBE</span></div>
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar en toda la web o pegar URL...">
    <button class="btn" id="loadBtn">Buscar</button>
  </div>
  <button class="btn btn-secondary" id="installBtn">📲</button>
</header>

<div class="platforms-bar">
  <button class="plat-btn active" data-plat="youtube">▶️ YouTube</button>
  <button class="plat-btn" data-plat="dailymotion">🎬 Dailymotion</button>
  <button class="plat-btn" data-plat="vimeo">📹 Vimeo</button>
  <button class="plat-btn" data-plat="tv">📡 TV en Vivo</button>
  <button class="plat-btn" data-plat="web">🌐 Web</button>
</div>

<main>
  <div class="player-section">
    <div class="video-wrapper" id="videoWrapper">
      <video id="nativePlayer" playsinline controls controlsList="nofullscreen" crossorigin="anonymous" preload="auto"></video>
      <div id="embedPlayer"></div>
      
      <div class="gesture-overlay volume" id="volumeOverlay">
        <div class="gesture-icon" id="volumeIcon">🔊</div>
        <div class="gesture-text" id="volumeText">100%</div>
        <div class="gesture-bar"><div class="gesture-fill" id="volumeFill" style="height:20%"></div></div>
      </div>
      <div class="gesture-overlay brightness" id="brightnessOverlay">
        <div class="gesture-icon" id="brightnessIcon">☀️</div>
        <div class="gesture-text" id="brightnessText">100%</div>
        <div class="gesture-bar"><div class="gesture-fill" id="brightnessFill" style="height:50%"></div></div>
      </div>
    </div>
    
    <div class="controls-bar">
      <div class="control-group">
        <label for="volumeRange">Volumen</label>
        <input type="range" id="volumeRange" min="0" max="100" value="100">
        <span id="volVal">100%</span>
        <span id="volNote"></span>
      </div>
      <div class="control-group" style="margin-left:auto">
        <button class="icon-btn" id="prevBtn" title="Anterior">⏮</button>
        <button class="icon-btn" id="pauseBtn" title="Play/Pausa">⏸</button>
        <button class="icon-btn" id="nextBtn" title="Siguiente">⏭</button>
        <button class="icon-btn" id="repeatBtn" title="Repetir">🔄</button>
        <button class="icon-btn" id="audioBtn" title="Idioma del audio">🎧</button>
        <button class="icon-btn" id="likeBtn" title="Favorito">🤍</button>
        <button class="icon-btn" id="subsBtn" title="Subtítulos">💬</button>
        <button class="icon-btn" id="dlBtn" title="Descargar video">⬇️</button>
        <button class="icon-btn" id="fsBtn" title="Pantalla completa">⛶</button>
      </div>
    </div>
    <div class="video-info" id="videoInfo">
      <h2 id="videoTitle"></h2>
      <div class="meta" id="videoMeta"></div>
      <div class="desc" id="videoDesc"></div>
      <button class="toggle-desc" id="toggleDesc">Mostrar más</button>
    </div>
  </div>

  <aside class="playlist-sidebar">
    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="trending">🔥 Explorar</button>
      <button class="tab-btn" data-tab="lists">📚 Mis listas</button>
    </div>
    <div class="tab-pane active" id="paneTrending">
      <div id="suggestionsList"><div class="loading-msg">Cargando...</div></div>
    </div>
    <div class="tab-pane" id="paneLists"><div id="listsContent"></div></div>
  </aside>
</main>

<button class="exit-fs-btn" id="exitFsBtn" aria-label="Salir de pantalla completa">✕</button>
<div class="toast" id="toast"></div>

<div class="custom-modal" id="confirmModal">
  <div class="custom-modal-box">
    <p id="confirmMsg">¿Deseas eliminar el historial?</p>
    <div class="custom-modal-actions">
      <button class="btn btn-secondary" id="confirmCancel">Cancelar</button>
      <button class="btn" style="background:#ef4444;" id="confirmOk">Aceptar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* ===== PWA ===== */
(function(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#030712"/><polygon points="200,150 380,256 200,362" fill="#06b6d4"/><text x="256" y="460" text-anchor="middle" font-family="Arial" font-size="56" font-weight="bold" fill="#f8fafc">NEXUS</text></svg>`;
  const icon='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  $('faviconLink').href=icon;
  const m={name:'NexusTube',short_name:'NexusTube',start_url:location.pathname,scope:'./',

function toast(msg,ms=3000){const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms)}
function parseVideoId(input){if(!input)return null;input=input.trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(input))return input;
  for(const p of [/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
    /[?&]v=([a-zA-Z0-9_-]{11})/]){const m=input.match(p);if(m&&m[1])return m[1]}
  return null}
function extractId(path){if(!path)return null;
  const m=path.match(/[?&]v=([a-zA-Z0-9_-]{11})/)||path.match(/([a-zA-Z0-9_-]{11})(?:[?&]|$)/);
  return m?m[1]:null}
function fmtDur(sec){if(sec===undefined||sec===null||sec<0||isNaN(sec))return '';
  sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return m+':'+String(s).padStart(2,'0')}
function detectSource(input){if(!input)return null;const s=input.trim();
  if(/\.(mp4|webm|ogg|ogv|mov|m4v|m3u8)(\?|#|$)/i.test(s))return{type:'direct',url:s};
  const yt=parseVideoId(s);if(yt)return{type:'youtube',id:yt};
  const vm=s.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(vm)return{type:'vimeo',id:vm[1]};
  const dm=s.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);if(dm)return{type:'dailymotion',id:dm[1]};
  if(/^https?:\/\//.test(s))return{type:'iframe',url:s};
  if(/^[a-zA-Z0-9_-]{11}$/.test(s))return{type:'youtube',id:s};
  return null}

function attachAudioResumeListener(){
  if(audioResumeListenerAttached)return;audioResumeListenerAttached=true;
  const bootstrap=async()=>{try{
    if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
    if(audioCtx.state==='suspended'){try{await audioCtx.resume()}catch(_){}}
    if(audioCtx.state==='running'&&playerMode==='native'&&!gainNode){
      const boosted=setupBoost($('nativePlayer'));if(boosted){updateVolumeMax();applyVolume(currentVolume)}}
  }catch(_){}};
  document.addEventListener('click',bootstrap,{passive:true});
}

function updateVolumeMax(){
  const range=$('volumeRange');const canBoost=(playerMode==='native'&&gainNode!==null);
  range.max=canBoost?500:100;
  if(!canBoost&&currentVolume>100){currentVolume=100;range.value=100;$('volVal').textContent='100%';applyVolume(100)}
  else range.value=currentVolume;
  $('volNote').textContent=canBoost?'· hasta 500%':'';
  $('volNote').style.color=canBoost?'var(--ok)':'var(--muted)';
}
function applyVolume(v){
  currentVolume=Math.max(0,Math.min(500,v));$('volVal').textContent=currentVolume+'%';
  if(playerMode==='native'){
    const el=$('nativePlayer');if(el.muted&&currentVolume>0)el.muted=false;
    if(gainNode&&audioCtx&&audioCtx.state==='running'){gainNode.gain.value=currentVolume/100;el.volume=1}
    else el.volume=Math.min(1,currentVolume/100);
  } else if(playerMode==='iframe' && ytPlayer && ytPlayer.setVolume){
    try{ytPlayer.setVolume(Math.min(100,currentVolume));}catch(_){}
  }
  $('volumeRange').value = currentVolume;
}
function applyBrightness(b){
  currentBrightness = Math.max(0.1, Math.min(2, b));
  $('nativePlayer').style.filter = `brightness(${currentBrightness})`;
  $('embedPlayer').style.filter = `brightness(${currentBrightness})`;
}
$('volumeRange').addEventListener('input',e=>applyVolume(parseInt(e.target.value,10)));
function setupBoost(videoEl){try{
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return false}}
  if(audioCtx.state!=='running'){gainNode=null;return false}
  if(connectedVideo!==videoEl){
    if(mediaSourceNode){try{mediaSourceNode.disconnect()}catch(_){}}
    mediaSourceNode=audioCtx.createMediaElementSource(videoEl);
    gainNode=audioCtx.createGain();mediaSourceNode.connect(gainNode);gainNode.connect(audioCtx.destination);
    connectedVideo=videoEl;
  }
  gainNode.gain.value=Math.min(currentVolume,500)/100;return true;
}catch(e){gainNode=null;return false}}

function loadYouTubeAPI(cb) {
  if (ytApiReady) { cb(); return; }
  if (ytApiLoading) {
    const check = setInterval(() => {
      if (ytApiReady) { clearInterval(check); cb(); }
    }, 100);
    return;
  }
  ytApiLoading = true;
  window.onYouTubeIframeAPIReady = () => {
    ytApiReady = true;
    ytApiLoading = false;
    cb();
  };
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}

  if (ytPlayer) {
    try {
      if (typeof ytPlayer.mute === 'function') ytPlayer.mute();
      if (typeof ytPlayer.setVolume === 'function') ytPlayer.setVolume(0);
      if (typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
      if (typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
      if (typeof ytPlayer.destroy === 'function') ytPlayer.destroy();
    } catch(e) {}

const vw = $('videoWrapper');
vw.addEventListener('touchstart', (e) => {
  if(e.touches.length !== 1) return;
  touchStartY = e.touches[0].clientY;
  touchStartVol = currentVolume;
  touchStartBright = currentBrightness;
  isSwiping = false;
  swipeSide = e.touches[0].clientX > (vw.clientWidth / 2) ? 'right' : 'left';
}, {passive: true});

vw.addEventListener('touchmove', (e) => {
  if(e.touches.length !== 1) return;
  const deltaY = touchStartY - e.touches[0].clientY;

  if(!isSwiping && Math.abs(deltaY) > 15) {
    isSwiping = true;
    vw.classList.add('swiping');
    if(swipeSide === 'right') $('volumeOverlay').classList.add('show');
    else $('brightnessOverlay').classList.add('show');
  }

  if(isSwiping) {
    e.preventDefault();
    if(swipeSide === 'right') {
      const maxVol = playerMode === 'native' ? 500 : 100;
      let newVol = Math.max(0, Math.min(maxVol, touchStartVol + (deltaY * 1.5)));
      applyVolume(newVol);
      $('volumeIcon').textContent = newVol > 100 ? '🔊' : (newVol > 0 ? '🔉' : '🔇');
      $('volumeText').textContent = Math.round(newVol) + '%';
      $('volumeFill').style.height = (newVol/maxVol*100) + '%';
    } else {
      let newBright = Math.max(0.1, Math.min(2, touchStartBright + (deltaY * 0.005)));
      applyBrightness(newBright);
      $('brightnessIcon').textContent = newBright > 1 ? '☀️' : '🌤️';
      $('brightnessText').textContent = Math.round(newBright * 100) + '%';
      $('brightnessFill').style.height = (newBright/2*100) + '%';
    }
  }
}, {passive: false});

vw.addEventListener('touchend', () => {
  if(isSwiping) {
    setTimeout(() => {
      $('volumeOverlay').classList.remove('show');
      $('brightnessOverlay').classList.remove('show');
    }, 600);
  }
  isSwiping = false;
  vw.classList.remove('swiping');
});

/* destroyPlayer: mute inmediato + limpieza async */
function destroyPlayer(){
  // Mute inmediato (síncrono) - CRÍTICO para evitar solapamiento de audio
  if(ytPlayer) {
    try {
      if(typeof ytPlayer.mute === 'function') ytPlayer.mute();
      if(typeof ytPlayer.setVolume === 'function') ytPlayer.setVolume(0);
      if(typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
    } catch(e) {}
  }
  const nativeEl = $('nativePlayer');
  try {
    nativeEl.muted = true;
    nativeEl.pause();
  } catch(_) {}
  
  // Guardar refs para cleanup async
  const oldYT = ytPlayer;
  const oldHls = hlsInstance;
  ytPlayer = null;
  hlsInstance = null;
  
  // Cleanup async
  setTimeout(() => {
    if(oldYT) {
      try {
        if(typeof oldYT.stopVideo === 'function') oldYT.stopVideo();
        if(typeof oldYT.destroy === 'function') oldYT.destroy();
      } catch(e) {}
    }
    if(oldHls) {
      try { oldHls.destroy(); } catch(e) {}
    }
    try {
      nativeEl.volume = 0;
      nativeEl.removeAttribute('src');
      nativeEl.load();
    } catch(_) {}
  }, 100);
  
  // Ocultar UI inmediatamente
  nativeEl.style.display = 'none';
  nativeEl.style.filter = 'none';
  const embed = $('embedPlayer');
  embed.style.display = 'none';
  embed.innerHTML = '';
  embed.style.filter = 'none';
  
  playerMode = 'none';
  availableAudioTracks = [];
  currentAudioTrackId = null;
  availableSubtitles = [];
  currentSubtitle = null;
  preloadedNext = null;
  currentStreamUrl = null;
  updateDownloadBtn(false);
  if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
}

async function loadYouTube(id,startTime,token){
  fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`)
    .then(r => r.json()).then(data => {
      if(token===loadToken && data.title) {
        currentCategory = data.author_name || '';
        $('videoTitle').textContent = data.title;
        $('videoMeta').textContent = data.author_name || '';
        $('videoInfo').classList.add('visible');
        updateMediaSession(data.title, data.author_name);
      }
    }).catch(()=>{});

  try {
    const data=await pipedFetch('/streams/'+id,4000);
    if(token!==loadToken) return;
    currentVideoData=data;
    setVideoInfoFromPiped(data);
    if(data.uploader) currentCategory = data.uploader;
    if(data.relatedStreams){
      relatedCache[id]=data.relatedStreams.filter(r=>r.type==='stream'&&r.url)
        .map(r=>({id:extractId(r.url),title:r.title||'',uploader:r.uploaderName||''})).filter(r=>r.id);
    }
    const nativeOk = await tryNativeFromData(id,startTime,data);
    if(nativeOk) return;
  } catch(e) { console.warn('Piped falló'); }

  try {
    const invRes=await invidiousFetch('/api/v1/videos/'+id, 4000);
    if(token!==loadToken) return;
    const data=invRes.data;
    currentVideoData=data;
    setVideoInfoFromInvidious(data);
    if(data.author) currentCategory = data.author;
    
    const streams = data.formatStreams || [];
    if(streams.length > 0) {
      let best = streams.find(s => s.itag === '22' || s.qualityLabel === '720p') || streams[0];
      const proxyUrl = `${invRes.base}/latest_version?id=${id}&itag=${best.itag}&local=true`;
      const ok = await tryLoadVideoElement(proxyUrl, startTime, proxyUrl);
      if(ok) return;
    }
  } catch(e) { console.warn('Invidious también falló'); }
  
  console.warn('Video bloqueado. Usando YT.Player de respaldo.');
  loadYTPlayer(id, startTime);
}

async function tryNativeFromData(videoId,startTime,data){
  try{
    if(data.livestream||(data.hls&&!data.videoStreams))return false;
    const streams=(data.videoStreams||[]).filter(s=>!s.videoOnly&&s.url);
    if(!streams.length)return false;
    streams.sort((a,b)=>{const a720=Math.abs((a.height||0)-720),b720=Math.abs((b.height||0)-720);
      if(a720!==b720)return a720-b720;return (b.height||0)-(a.height||0)});
    const chosen=streams[0];
    return await tryLoadVideoElement(chosen.url, startTime, chosen.url);
  }catch(_){return false}
}

async function tryLoadVideoElement(url, startTime, downloadUrl) {
  const el=$('nativePlayer');
  el.muted = false;
  el.volume = 1;
  el.crossOrigin='anonymous';
  el.src=url;
  el.load();
  const ok=await new Promise(resolve=>{
    let done=false;
    const fin=v=>{if(!done){done=true;resolve(v)}};
    el.addEventListener('loadedmetadata',()=>fin(true),{once:true});
    el.addEventListener('error',()=>fin(false),{once:true});
    setTimeout(()=>fin(false),4000);
  });
  if(!ok){try{el.removeAttribute('src');el.load()}catch(_){}return false}
  if(startTime>0)el.currentTime=startTime;
  setupBoost(el);
  detectNativeAudioTracks(el);
  
  $('embedPlayer').style.display='none';
  el.style.display='block';
  playerMode='native';
  updateVolumeMax();
  try{await el.play()}catch(e){
    try{el.muted=true;await el.play();toast('🔇 Toca para sonido')}catch(_){}
  }
  applyVolume(currentVolume);
  applyBrightness(currentBrightness);
  updatePauseBtn();
  
  currentStreamUrl = downloadUrl || url;
  updateDownloadBtn(true);
  return true;
}

async function loadTV(ch,idx){
  destroyPlayer();if(typeof idx==='number'&&idx>=0)tvSeqIdx=idx;
  const el=$('nativePlayer');el.style.display='block';el.crossOrigin='anonymous';playerMode='native';
  let skipped=false;
  const onError=()=>{if(skipped)return;skipped=true;toast('⚠️ Canal no disponible, saltando...');
    if(hlsInstance){try{hlsInstance.destroy()}catch(_){}hlsInstance=null}
    if(tvSeqList.length&&tvSeqIdx>=0&&tvSeqIdx<tvSeqList.length-1)setTimeout(()=>playTVByIndex(tvSeqIdx+1),800)};
  const timeout=setTimeout(()=>{if(el.readyState<2)onError()},9000);
  el.addEventListener('loadeddata',()=>clearTimeout(timeout),{once:true});
  el.addEventListener('error',onError,{once:true});
  if(ch.url.includes('.m3u8')&&window.Hls&&Hls.isSupported()){
    hlsInstance=new Hls({enableWorker:true,lowLatencyMode:false});
    hlsInstance.loadSource(ch.url);hlsInstance.attachMedia(el);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{clearTimeout(timeout);detectHLSAudioTracks();detectHLSSubs()});
    hlsInstance.on(Hls.Events.AUDIO_TRACKS_UPDATED,()=>detectHLSAudioTracks());
    hlsInstance.on(Hls.Events.SUBTITLE_TRACKS_UPDATED,()=>detectHLSSubs());
    hlsInstance.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)onError()});
  }else{el.src=ch.url;detectNativeAudioTracks(el)}
  setupBoost(el);updateVolumeMax();
  try{await el.play();el.muted=false}catch(e){
    try{el.muted=true;await el.play();
      const tryUnmute=()=>{if(!el.paused){el.muted=false;applyVolume(currentVolume)}};
      el.addEventListener('playing',tryUnmute,{once:true});
      el.addEventListener('canplay',tryUnmute,{once:true});
      setTimeout(tryUnmute,300);
    }catch(_){}
  }
  applyVolume(currentVolume);applyBrightness(currentBrightness);updatePauseBtn();
  currentStreamUrl = ch.url;
  updateDownloadBtn(true);
}
function playTVByIndex(idx){
  if(idx<0||idx>=tvSeqList.length){toast('No hay más canales');return}
  tvSeqIdx=idx;const ch=tvSeqList[idx];
  document.querySelectorAll('.channel-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const cur=document.querySelectorAll('.channel-item')[idx];if(cur)cur.scrollIntoView({behavior:'smooth',block:'nearest'});
  playVideo({type:'tv',channel:ch,idx},{title:ch.name});
}

function updateMediaSession(title, artist) {
  if('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title, artist: artist, album: 'NexusTube',
      artwork: [{src: `https://i.ytimg.com/vi/${currentVideoId}/mqdefault.jpg`, sizes: '320x180', type: 'image/jpeg'}]
    });
  }
}

function detectNativeAudioTracks(el){availableAudioTracks=[];currentAudioTrackId=null;try{
  if(el.audioTracks&&el.audioTracks.length>1){
    for(let i=0;i<el.audioTracks.length;i++){const t=el.audioTracks[i];
      availableAudioTracks.push({id:i,name:t.label||t.language||('Pista '+(i+1)),lang:t.language||'',source:'native'});
      if(t.enabled)currentAudioTrackId=i}
  }}catch(_){}}
function detectHLSAudioTracks(){availableAudioTracks=[];currentAudioTrackId=null;try{
  if(!hlsInstance||!hlsInstance.audioTracks||!hlsInstance.audioTracks.length)return;
  hlsInstance.audioTracks.forEach((t,i)=>availableAudioTracks.push({id:i,name:t.name||t.lang||('Pista '+(i+1)),lang:t.lang||'',source:'hls'}));
  currentAudioTrackId=hlsInstance.audioTrack}catch(_){}}
function detectHLSSubs(){try{if(!hlsInstance||!hlsInstance.subtitleTracks)return;
  hlsInstance.subtitleTracks.forEach((t,i)=>{const code=t.lang||t.name||('track-'+i);
    if(!availableSubtitles.find(s=>s.code===code))availableSubtitles.push({code,name:t.name||t.lang||code,auto:!!t.forced,source:'hls',idx:i})})}catch(_){}}

      currentAudioTrackId=id;toast('🎧 '+track.name)}
    close();
  }));
});

async function applySubtitle(code, src){
  currentSubtitle = code;
  
  // YouTube iframe: usar API nativa de captions
  if(playerMode === 'iframe' && ytPlayer) {
    try {
      if(!code) {
        ytPlayer.unloadModule('captions');
        toast('Subtítulos desactivados');
        return;
      }
      const list = ytPlayer.getOption('captions', 'tracklist') || [];
      if(list.length === 0) {
        toast('⚠️ YouTube no tiene subtítulos');
        return;
      }
      const match = list.find(t => t.languageCode === code) || list[0];
      ytPlayer.loadModule('captions');
      ytPlayer.setOption('captions', 'track', { languageCode: match.languageCode });
      ytPlayer.setOption('captions', 'reload', true);
      toast('💬 ' + (match.displayName || match.languageCode));
      return;
    } catch(e) {
      console.warn('YT subs error:', e);
      toast('⚠️ Error al activar subtítulos');
      return;
    }
  }
  
  // HLS subtitles
  if(hlsInstance && hlsInstance.subtitleTracks?.length) {
    if(!code) {
      try { hlsInstance.subtitleTrack = -1; hlsInstance.subtitleDisplay = false; } catch(_){}
      toast('Subtítulos desactivados');
      return;
    }
    const sub = availableSubtitles.find(s => s.code === code && s.source === 'hls');
    if(sub) {
      try {
        hlsInstance.subtitleTrack = sub.idx;
        hlsInstance.subtitleDisplay = true;
        toast('💬 ' + sub.name);
        return;
      } catch(_){}
    }
  }
  
  // Native player: descargar VTT, convertir a Blob, aplicar
  const el = $('nativePlayer');
  el.querySelectorAll('track').forEach(t => t.remove());
  
  if(!code) { toast('Subtítulos desactivados'); return; }
  
  const sub = availableSubtitles.find(s => s.code === code);
  if(!sub || !sub.url) { toast('⚠️ Subtítulo no disponible'); return; }
  
  try {
    const response = await fetch(sub.url);
    if(!response.ok) throw new Error('HTTP ' + response.status);
    let text = await response.text();
    
    // Normalizar a VTT
    text = text.replace(/\r\n/g, '\n').trim();
    if(!text.startsWith('WEBVTT')) {
      text = 'WEBVTT\n\n' + text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    }
    
    const blob = new Blob([text], { type: 'text/vtt' });
    const blobUrl = URL.createObjectURL(blob);
    
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = sub.name || code;
    track.srclang = code;
    track.src = blobUrl;
    track.default = true;
    el.appendChild(track);
    
    setTimeout(() => {
      try {
        for(let i = 0; i < el.textTracks.length; i++) {
          el.textTracks[i].mode = 'showing';
        }
        toast('💬 ' + sub.name);
      } catch(e) { console.warn('Subs showing error:', e); }
    }, 300);
  } catch(e) {
    console.error('Subtitle error:', e);
    toast('⚠️ Error al cargar subtítulos');
  }
}

  else if(playerMode==='iframe' && ytPlayer && ytPlayer.getPlayerState) {
    try { playing = ytPlayer.getPlayerState() === 1; } catch(_){}
  }
  btn.textContent=playing?'⏸':'▶';
}

async function pickRelated(id){
  if(!relatedCache[id]){try{const data=await pipedFetch('/streams/'+id,4000);
    relatedCache[id]=(data.relatedStreams||[]).filter(r=>r.type==='stream'&&r.url)
      .map(r=>({id:extractId(r.url),title:r.title||'',uploader:r.uploaderName||''})).filter(r=>r.id);
  }catch(_){relatedCache[id]=[]}}
  
  let pool=(relatedCache[id]||[]).filter(v=>v.id!==id&&!recentlyPlayed.has(v.id));
  if(!pool.length) return null;
  const currentArtist = currentCategory.toLowerCase();
  const sameCategory = pool.filter(v => 
    (v.uploader && v.uploader.toLowerCase().includes(currentArtist)) || 
    (v.title && v.title.toLowerCase().includes(currentArtist))
  );
  const finalPool = sameCategory.length > 0 ? sameCategory : pool;
  return finalPool[Math.floor(Math.random()*finalPool.length)];
}

async function preloadNext(currentId){
  if(!currentId || isAutoAdvancing) return;
  try {
    const next = await pickRelated(currentId);
    if(next){
      const img = new Image();
      img.src = `https://i.ytimg.com/vi/${next.id}/mqdefault.jpg`;
      fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${next.id}`)
        .then(r => r.json()).catch(()=>{});
      preloadedNext = next;
    }
  } catch(e) {}
}

async function handleEnded(){
  if(isAutoAdvancing) return;
  isAutoAdvancing = true;
  try {
    if(!currentVideoId) return;
    
    let next = preloadedNext;
    preloadedNext = null;
    
    if(!next) {
      next = await pickRelated(currentVideoId);
    }
    
    // Fallback: usar trending si no hay relacionados
    if(!next) {
      try {
        const trending = await pipedFetch('/trending?region=US', 3000);
        const items = trending.items || trending || [];
        if(items.length > 0) {
          const randomItem = items[Math.floor(Math.random() * items.length)];
          const id = extractId(randomItem.url);
          if(id) {
            next = {
              id,
              title: randomItem.title || 'Video',
              uploader: randomItem.uploaderName || randomItem.uploader || ''
            };
          }
        }
      } catch(e) {}
    }
    
    if(next) {
      toast(`▶️ ${next.title ? next.title.slice(0,50) : 'Siguiente video'}`, 2500);
      await playVideo({type:'youtube', id:next.id}, {title:next.title});
    } else {
      toast('No hay más videos disponibles');
    }
  } catch(e) {
    console.warn('handleEnded error:', e);
  } finally {
    isAutoAdvancing = false;
  }
}

async function loadTrending(){
  $('suggestionsList').innerHTML = '<div class="loading-msg">Cargando estrenos...</div>';
  const topics = ['estrenos de peliculas 2025', 'nuevos animes 2025', 'trailers de series 2025', 'nuevos videojuegos 2025', 'estrenos musicales 2025'];
  const randomTopic = topics[Math.floor(Math.random() * topics.length)];
  if(Math.random() > 0.5){
    try{
      const data=await pipedFetch('/search?q='+encodeURIComponent(randomTopic)+'&filter=videos', 5000);
      const items=(data.items||[]);
      if(items.length){
        renderResults(items.slice(0,25).map(i=>({id:extractId(i.url),title:i.title,uploader:i.uploaderName||i.uploader,
          thumbnail:i.thumbnail,duration:i.duration,platform:'youtube'})).filter(i=>i.id),'youtube');
        return;
      }
    }catch(_){}
  }
  const shuffled = TRENDING_SOURCES.slice().sort(() => 0.5 - Math.random());
  for(const source of shuffled){
    try{
      const data = await source();
      const items = Array.isArray(data) ? data : (data.items || []);
      if(items.length){

function parseVimeoRSS(xml){
  const items=[];const matches=xml.matchAll(/<item>([\s\S]*?)<\/item>/g);
  for(const m of matches){const inner=m[1];
    const tM=inner.match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/);
    const lM=inner.match(/<link>([\s\S]*?)<\/link>/);
    const thM=inner.match(/<media:thumbnail[^>]*url="([^"]*)"/);
    if(lM){const idM=lM[1].match(/vimeo\.com\/(\d+)/);
      if(idM)items.push({id:idM[1],title:tM?tM[1].trim():'Vimeo',uploader:'Vimeo Staff Picks',
        thumbnail:thM?thM[1]:'',platform:'vimeo'})}}
  return items.slice(0,20);
}

async function searchYouTube(q){
  try{
    const results=await Promise.allSettled(PIPED.map(async base=>{
      const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),4500);
      const res=await fetch(base+'/search?q='+encodeURIComponent(q)+'&filter=videos',{signal:ctrl.signal});
      clearTimeout(t);if(!res.ok)throw 0;
      const data=await res.json();
      const items=(data.items||[]).map(i=>({id:extractId(i.url),title:i.title,
        uploader:i.uploaderName||i.uploader||'',thumbnail:i.thumbnail,duration:i.duration,platform:'youtube'})).filter(i=>i.id);
      if(!items.length)throw 0;return items}));
    const ok=results.find(r=>r.status==='fulfilled');
    if(ok&&ok.value.length)return ok.value;
  }catch(_){}
  try{
    const results=await Promise.allSettled(INVIDIOUS.map(async base=>{
      const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),4500);
      const res=await fetch(base+'/api/v1/search?q='+encodeURIComponent(q)+'&type=video',{signal:ctrl.signal});
      clearTimeout(t);if(!res.ok)throw 0;
      const data=await res.json();
      const items=(Array.isArray(data)?data:[]).map(v=>({id:v.videoId,title:v.title,
        uploader:v.author||'',thumbnail:v.videoThumbnails?.[0]?.url||`https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`,
        duration:v.lengthSeconds,platform:'youtube'})).filter(i=>i.id);
      if(!items.length)throw 0;return items}));
    const ok=results.find(r=>r.status==='fulfilled');
    if(ok&&ok.value.length)return ok.value;
  }catch(_){}
  return [];
}

const SEARXNG_INSTANCES=[
  'https://searx.tiekoetter.com','https://baresearch.org','https://search.inetol.net',
  'https://paulgo.io','https://searxng.site','https://opnxng.com','https://searx.be',
  'https://priv.au','https://search.bus-hit.me','https://searx.work'
];
async function searchSearXNG(q,category='videos'){
  const ps=SEARXNG_INSTANCES.map(async base=>{
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),5000);
    try{
      const targetUrl = `${base}/search?q=${encodeURIComponent(q)}&format=json&categories=${category}&language=all&safesearch=0`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
      const res=await fetch(proxyUrl,{signal:ctrl.signal});
      clearTimeout(t);if(!res.ok)throw 0;
      const data=await res.json();
      return (data.results||[]).map(r=>{
        const ytId=r.url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        const vmId=r.url.match(/vimeo\.com\/(\d+)/);
        const dmId=r.url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
        const iaId=r.url.match(/archive\.org\/(?:details|embed)\/([^\/\?]+)/);
        let platform='web',id=r.url;
        if(ytId){platform='youtube';id=ytId[1]}
        else if(vmId){platform='vimeo';id=vmId[1]}
        else if(dmId){platform='dailymotion';id=dmId[1]}
        else if(iaId){platform='archive';id=iaId[1]}
        const thumb=r.thumbnail||r.img_src||r.thumbnail_src||'';
        return{id,title:r.title||'',uploader:r.engine||'web',thumbnail:thumb,
          duration:r.length?parseDuration(r.length):0,url:r.url,platform,isExternal:platform==='web'};
      });
    }catch(_){clearTimeout(t);throw 0}
  });
  const results=await Promise.allSettled(ps);
  const all=[];results.forEach(r=>{if(r.status==='fulfilled'&&r.value)all.push(...r.value)});
  return all;
}
function parseDuration(str){
  if(typeof str==='number')return str;
  const p=String(str).split(':').map(Number);
  if(p.length===2)return p[0]*60+p[1];
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  return 0;
}
async function searchWeb(q){
  const [sxV,sxG,yt,dm,pt,ia]=await Promise.allSettled([
    searchSearXNG(q,'videos'),searchSearXNG(q,'general'),
    searchYouTube(q),searchDailymotion(q),searchPeerTube(q),searchArchive(q)
  ]);
  const items=[];
  if(sxV.status==='fulfilled')items.push(...sxV.value);
  if(sxG.status==='fulfilled')items.push(...sxG.value);
  if(yt.status==='fulfilled')items.push(...yt.value);
  if(dm.status==='fulfilled')items.push(...dm.value);
  if(pt.status==='fulfilled')items.push(...pt.value);
  if(ia.status==='fulfilled')items.push(...ia.value);
  const seen=new Set();
  return items.filter(i=>{const k=i.url||i.id;if(seen.has(k))return false;seen.add(k);return true});
}

function renderResults(items,type){
  const list=$('suggestionsList');list.innerHTML='';
  if(!items||!items.length){list.innerHTML='<div class="empty-msg">Sin resultados</div>';return}
  const seen=new Set();
  items.forEach((item,idx)=>{
    if(!item.id||seen.has(item.id))return;seen.add(item.id);
    const plat=item.platform||'youtube';
    let thumb=item.thumbnail||'';
    if(!thumb&&plat==='youtube')thumb=`https://i.ytimg.com/vi/${item.id}/mqdefault.jpg`;
    const tag=plat==='dailymotion'?'DM':plat==='youtube'?'YT':plat==='vimeo'?'VM':
      plat==='peertube'?'PT':plat==='archive'?'IA':plat==='web'?'WEB':'';
    const dur=fmtDur(item.duration);const eager=idx<8?'eager':'lazy';
    const div=document.createElement('div');div.className='video-item';div.dataset.vid=item.id;
    div.innerHTML=`<div class="thumb-wrap">
        ${tag?`<span class="platform-tag">${tag}</span>`:''}
        <img src="${esc(thumb)}" alt="" loading="${eager}" decoding="async" referrerpolicy="no-referrer" onerror="this.style.opacity=0">
        ${dur?`<span class="duration">${esc(dur)}</span>`:''}
      </div>
      <div class="video-item-info"><h4>${esc(item.title||'Sin título')}</h4><p>${esc(item.uploader||'')}</p></div>
      <div class="video-item-actions"><button data-add title="Añadir">+</button></div>`;
    div.addEventListener('click',e=>{
      if(e.target.closest('[data-add]')){e.stopPropagation();
        showAddToList({id:item.id,title:item.title,uploader:item.uploader,platform:plat},e.target);return}
      if(plat==='web'&&item.url){
        const src=detectSource(item.url);
        if(src)playVideo(src,{title:item.title});
        else{window.open(item.url,'_blank','noopener noreferrer');toast('↗️ Abriendo en nueva pestaña')}
      }
      else if(plat==='dailymotion')playVideo({type:'dailymotion',id:item.id},{title:item.title});
      else if(plat==='vimeo')playVideo({type:'vimeo',id:item.id},{title:item.title});
      else if(plat==='peertube')playVideo({type:'iframe',url:item.url},{title:item.title});
      else if(plat==='archive')playVideo({type:'archive',id:item.id},{title:item.title});
      else playVideo({type:'youtube',id:item.id},{title:item.title, category:item.uploader});
      window.scrollTo({top:0,behavior:'smooth'});
    });
    list.appendChild(div);
  });
  highlightActive(currentVideoId);
}

  {code:'ca',name:'Canadá'},{code:'au',name:'Australia'},{code:'jp',name:'Japón'},
  {code:'kr',name:'Corea'},{code:'cn',name:'China'},{code:'in',name:'India'},
  {code:'ru',name:'Rusia'},{code:'tr',name:'Turquía'},{code:'eg',name:'Egipto'}
];
const TV_CATEGORIES=[
  {slug:'news',name:'📰 Noticias'},{slug:'sports',name:'⚽ Deportes'},
  {slug:'movies',name:'🎬 Películas'},{slug:'kids',name:'🧸 Infantil'},
  {slug:'music',name:'🎵 Música'},{slug:'documentary',name:'📖 Documentales'},
  {slug:'entertainment',name:'🎭 Entretenimiento'},{slug:'culture',name:'🎨 Cultura'},
  {slug:'education',name:'📚 Educación'},{slug:'religious',name:'⛪ Religioso'},
  {slug:'animation',name:'🎨 Animación'},{slug:'series',name:'📺 Series'},
  {slug:'comedy',name:'😂 Comedia'},{slug:'family',name:'👨‍👩‍👧 Familiar'}
];
const TV_EXTRA_SOURCES={
  tdtchannels:'https://www.tdtchannels.com/lists/tv.m3u8',
  pluto:'https://iptv-org.github.io/iptv/categories/movies.m3u',
  plex:'https://iptv-org.github.io/iptv/categories/series.m3u',
  samsung:'https://iptv-org.github.io/iptv/categories/music.m3u',
  lg:'https://iptv-org.github.io/iptv/categories/news.m3u',
  freeTvIntl:'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8'
};
function normalizeName(n){return (n||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[^\w\s]/g,'')}
function dedupeChannels(channels){
  const map=new Map();
  channels.forEach(ch=>{const key=normalizeName(ch.name);if(!key)return;
    if(!map.has(key))map.set(key,ch);
    else{const prev=map.get(key);const prevHls=/\.m3u8/.test(prev.url),curHls=/\.m3u8/.test(ch.url);
      if(curHls&&!prevHls)map.set(key,ch)}});
  return Array.from(map.values());
}
function showTVNav(){
  const list=$('suggestionsList');
  let html=`<input type="text" class="tv-global-search" id="tvGlobalInput" placeholder="🌍 Buscar canal en todo el mundo...">
    <div style="font-weight:600;margin-bottom:.75rem;font-size:.9rem">🌍 Por país</div><div class="tv-nav">`;
  TV_COUNTRIES.forEach(c=>{html+=`<button class="tv-nav-btn" data-type="country" data-code="${c.code}">${c.name}</button>`});
  html+=`</div><div style="font-weight:600;margin:.75rem 0;font-size:.9rem">📚 Por categoría</div><div class="tv-nav">`;
  TV_CATEGORIES.forEach(c=>{html+=`<button class="tv-nav-btn" data-type="category" data-code="${c.slug}">${c.name}</button>`});
  html+=`</div><div style="font-weight:600;margin:.75rem 0;font-size:.9rem">🎁 Fuentes Premium</div>
    <div class="tv-nav">
      <button class="tv-nav-btn" data-type="source" data-code="pluto">🎬 Películas Premium</button>
      <button class="tv-nav-btn" data-type="source" data-code="plex">📺 Series Premium</button>
      <button class="tv-nav-btn" data-type="source" data-code="samsung">🎵 Música Premium</button>
      <button class="tv-nav-btn" data-type="source" data-code="lg">📰 Noticias Premium</button>
      <button class="tv-nav-btn" data-type="source" data-code="tdtchannels">🇪🇸 TDTChannels</button>
      <button class="tv-nav-btn" data-type="source" data-code="freeTvIntl">🌍 Free-TV Intl</button>
    </div>`;
  list.innerHTML=html;
  list.querySelectorAll('.tv-nav-btn').forEach(b=>b.addEventListener('click',()=>loadTVList(b.dataset.type,b.dataset.code)));
  const gi=$('tvGlobalInput');
  gi.addEventListener('keypress',e=>{if(e.key==='Enter'){e.preventDefault();searchAllTV(gi.value)}});
}
async function loadTVList(type,code){
  const list=$('suggestionsList');
  list.innerHTML='<div class="loading-msg">Cargando canales...</div>';
  const urls=[];
  if(type==='country'){
    urls.push(`https://iptv-org.github.io/iptv/countries/${code}.m3u`);
    urls.push(`https://raw.githubusercontent.com/iptv-org/iptv/master/streams/${code}.m3u`);
  }else if(type==='category'){
    urls.push(`https://iptv-org.github.io/iptv/categories/${code}.m3u`);
    urls.push(`https://raw.githubusercontent.com/iptv-org/iptv/master/streams/categories/${code}.m3u`);
  }else if(type==='source'){
    if(TV_EXTRA_SOURCES[code])urls.push(TV_EXTRA_SOURCES[code]);
  }
  let all=[];
  await Promise.allSettled(urls.map(async url=>{
    try{const res=await fetch(url);if(!res.ok)return;const text=await res.text();
      all=all.concat(parseM3U(text))}catch(_){}
  }));
  if(!all.length){list.innerHTML='<div class="empty-msg">❌ No se pudo cargar la lista</div>';return}
  const deduped=dedupeChannels(all);
  renderTVChannels(deduped);
}
async function searchAllTV(q){
  q=(q||'').trim();if(!q)return;
  const list=$('suggestionsList');list.innerHTML='<div class="loading-msg">Buscando "'+esc(q)+'"...</div>';
  if(!tvGlobalCache){
    try{
      const [r1,r2]=await Promise.allSettled([
        fetch('https://iptv-org.github.io/iptv/index.m3u').then(r=>r.text()),
        fetch(TV_EXTRA_SOURCES.freeTvIntl).then(r=>r.text())
      ]);
      let all=[];
      if(r1.status==='fulfilled')all=all.concat(parseM3U(r1.value));
      if(r2.status==='fulfilled')all=all.concat(parseM3U(r2.value));
      tvGlobalCache=dedupeChannels(all);
    }catch(e){list.innerHTML='<div class="empty-msg">❌ No se pudo cargar catálogo</div>';return}
  }
  const ql=q.toLowerCase();
  const filtered=tvGlobalCache.filter(c=>(c.name||'').toLowerCase().includes(ql));
  if(!filtered.length){list.innerHTML='<div class="empty-msg">Sin canales con "'+esc(q)+'"</div>';return}
  renderTVChannels(filtered);
}
function parseM3U(text){
  const lines=text.split('\n'),channels=[];let cur=null;
  for(const line of lines){const t=line.trim();
    if(t.startsWith('#EXTINF:')){cur={};
      const logo=t.match(/tvg-logo="([^"]*)"/);if(logo)cur.logo=logo[1];
      const group=t.match(/group-title="([^"]*)"/);if(group)cur.group=group[1];
      const nm=t.match(/,(.+)$/);if(nm)cur.name=nm[1]}
    else if(t&&!t.startsWith('#')&&cur){cur.url=t;
      if(cur.name&&cur.url)channels.push(cur);cur=null}}
  return channels;
}
function renderTVChannels(channels){
  const list=$('suggestionsList');list.innerHTML='';
  tvSeqList=channels;tvSeqIdx=-1;
  const bar=document.createElement('div');bar.className='tv-controls';
  bar.innerHTML=`<button class="tv-back" id="tvBack">← Volver</button>
    <input type="text" class="tv-search" id="tvSearch" placeholder="Buscar canal...">
    <div class="tv-count" id="tvCount"></div>`;
  list.appendChild(bar);
  const container=document.createElement('div');list.appendChild(container);
  renderTVItems(container,channels);
  $('tvBack').addEventListener('click',showTVNav);
  const search=$('tvSearch');
  search.addEventListener('input',()=>{
    const q=search.value.toLowerCase().trim();
    const filtered=q?channels.filter(c=>(c.name||'').toLowerCase().includes(q)):channels;
    tvSeqList=filtered;tvSeqIdx=-1;renderTVItems(container,filtered)});
}
function renderTVItems(container,channels){
  container.innerHTML='';
  const count=$('tvCount');if(count)count.textContent=`${channels.length} canales`;
  if(!channels.length){container.innerHTML='<div class="empty-msg">Sin coincidencias</div>';return}
  const frag=document.createDocumentFragment();
  channels.forEach((ch,i)=>{
    const el=document.createElement('div');el.className='channel-item';el.dataset.idx=i;
    el.innerHTML=`<img src="${esc(ch.logo||'')}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity=0">
      <div class="info"><h4>${esc(ch.name)}</h4><p>${esc(ch.group||'')}</p></div>`;
    el.addEventListener('click',()=>playVideo({type:'tv',channel:ch,idx:i},{title:ch.name}));
    frag.appendChild(el);
  });
  container.appendChild(frag);
}
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='pane'+(name==='trending'?'Trending':'Lists')));
  if(name==='lists')renderLists();
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

attachAudioResumeListener();
updateVolumeMax();updateNavButtons();renderLists();updatePauseBtn();
document.addEventListener('click',()=>{
  const el=$('nativePlayer');if(el&&el.muted){el.muted=false;el.play().catch(()=>{})}
},{once:true});

async function playRandomInitial(){
  const history=getHistory();const lastPlayed=history[0];
  const exclude=new Set(history.slice(0,8).map(h=>h.id));
  let trending=[];
  try{
    const data=await pipedFetch('/trending?region=US',5000);
    const items=Array.isArray(data)?data:(data.items||[]);
    trending=items.slice(0,30).map(i=>({id:extractId(i.url),title:i.title,
      uploader:i.uploaderName||i.uploader||'',thumbnail:i.thumbnail,duration:i.duration})).filter(i=>i.id);
  }catch(_){trending=FALLBACK_YT.map(v=>({id:v.id,title:v.title,uploader:v.uploader,
    thumbnail:`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`}))}
  if(trending.length){renderResults(trending.map(t=>({...t,platform:'youtube',
    thumbnail:t.thumbnail||`https://i.ytimg.com/vi/${t.id}/mqdefault.jpg`})),'youtube')}
  if(!trending.length)return;
  const candidates=trending.filter(t=>!exclude.has(t.id));
  let pick=null;
  if(lastPlayed&&lastPlayed.uploader&&candidates.length){
    const same=candidates.filter(t=>t.uploader===lastPlayed.uploader);
    if(same.length)pick=same[Math.floor(Math.random()*same.length)]}
  if(!pick){const pool=candidates.length?candidates:trending;pick=pool[Math.floor(Math.random()*pool.length)]}
  if(!pick)return;
  const el=$('nativePlayer');try{el.muted=true}catch(_){}
  await playVideo({type:'youtube',id:pick.id},{title:pick.title});
  try{el.muted=false}catch(_){}
}
playRandomInitial();
</script>
